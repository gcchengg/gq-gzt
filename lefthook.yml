pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{css,js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      run: PATH="/usr/local/bin:/opt/homebrew/bin:$PATH" ./node_modules/.bin/prettier --write {staged_files}
      stage_fixed: true

    - name: format package.json
      glob: "package.json"
      run: PATH="/usr/local/bin:/opt/homebrew/bin:$PATH" ./node_modules/.bin/sort-package-json

    - name: lint
      glob: "*"
      run: PATH="/usr/local/bin:/opt/homebrew/bin:$PATH" HOME="${TMPDIR:-/tmp}" ./node_modules/.bin/biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}

    - name: type check
      run: PATH="/usr/local/bin:/opt/homebrew/bin:$PATH" ./node_modules/.bin/tsc --noEmit --allowJs --checkJs false --esModuleInterop true
