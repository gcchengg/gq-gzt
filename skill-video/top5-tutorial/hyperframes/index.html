<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Top 5 AI Skills Tutorial</title>
    <link rel="stylesheet" href="src/tokens.css" />
    <link rel="stylesheet" href="src/base.css" />
    <script src="vendor/gsap.min.js"></script>
  </head>
  <body>
    <div
      id="root"
      class="frame"
      data-composition-id="main"
      data-start="0"
      data-duration="335"
      data-width="1080"
      data-height="1920"
    >
      <section id="opening" class="clip" data-start="0" data-duration="20" data-track-index="1">
        <div class="scene-fill"></div>
      </section>
      <section id="find-skills" class="clip" data-start="20" data-duration="60" data-track-index="2"></section>
      <section id="tavily-search" class="clip" data-start="80" data-duration="60" data-track-index="3">
        <div class="scene-fill"></div>
      </section>
      <section id="summarize" class="clip" data-start="140" data-duration="60" data-track-index="4">
        <div class="scene-fill"></div>
      </section>
      <section id="skill-creator" class="clip" data-start="200" data-duration="60" data-track-index="5">
        <div class="scene-fill"></div>
      </section>
      <section id="document-suite" class="clip" data-start="260" data-duration="60" data-track-index="6">
        <div class="scene-fill"></div>
      </section>
      <section id="closing" class="clip" data-start="320" data-duration="15" data-track-index="7">
        <div class="scene-fill"></div>
      </section>
    </div>

    <script type="module">
      import { buildFindSkillsScene } from "./src/scenes/find-skills.js";

      document.querySelector("#find-skills").append(buildFindSkillsScene());

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.to(".scene-fill", { opacity: 1, duration: 335, ease: "none" }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
