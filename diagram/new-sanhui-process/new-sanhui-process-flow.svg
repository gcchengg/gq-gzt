    <text x="1005" y="584" class="note-title">评估批注规则</text>
    <text x="1005" y="614" class="note">联审人选择“需要提报人回复批注”时，给管户发送钉钉消息。</text>
    <text x="1005" y="640" class="note">提报人未回复前，评估不可提交。</text>
  </g>

  <g>
    <rect x="980" y="748" width="680" height="105" rx="10" fill="#0f172a"/>
    <rect x="980" y="748" width="680" height="105" rx="10" fill="rgba(6,78,59,0.30)" stroke="#34d399" stroke-width="1.5"/>
