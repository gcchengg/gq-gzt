  <path d="M870 220 C910 220, 915 220, 950 220" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrow-emerald)" fill="none"/>
  <path d="M870 415 C910 415, 915 415, 950 415" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrow-emerald)" fill="none"/>
  <path d="M870 610 C910 610, 915 610, 950 610" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrow-emerald)" fill="none"/>
  <path d="M870 805 C910 805, 915 805, 950 805" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#arrow-amber)" fill="none"/>
  <path d="M870 1000 C910 1000, 915 1000, 950 1000" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#arrow-amber)" fill="none"/>
  <path d="M870 1195 C910 1195, 915 1195, 950 1195" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#arrow)" fill="none"/>
  <path d="M870 1390 C910 1390, 915 1390, 950 1390" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#arrow)" fill="none"/>
  <path d="M870 1585 C910 1585, 915 1585, 950 1585" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrow-emerald)" fill="none"/>
  <path d="M870 1975 C910 1975, 915 1975, 950 1975" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrow-emerald)" fill="none"/>

  <!-- Phase labels -->
  <g>
    <rect x="82" y="175" width="220" height="90" rx="8" fill="#0f172a"/>
    <rect x="82" y="175" width="220" height="90" rx="8" fill="rgba(59,130,246,0.22)" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="192" y="214" text-anchor="middle" class="node-title">议题提报</text>
