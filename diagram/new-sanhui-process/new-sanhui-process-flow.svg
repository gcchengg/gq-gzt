    <path d="M728 1180 L840 1180 L840 1375 L830 1375" stroke="#64748b" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrow)" fill="none"/>
    <text x="780" y="1168" fill="#fb7185" font-size="11" font-weight="700">否：跳过</text>
