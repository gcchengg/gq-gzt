    <text x="650" y="1750" text-anchor="middle" class="node-title">表决建议</text>
    <text x="650" y="1776" text-anchor="middle" class="node-sub">操作：提交</text>
    <text x="650" y="1799" text-anchor="middle" class="tiny">给董监事发送表决建议单与投票任务</text>
  </g>

