    <text x="1005" y="944" class="note-title">提请部务会</text>
    <text x="1005" y="974" class="note">1. 根据“审批材料准备”是否开启部务会，决定是否展示该 tab。</text>
    <text x="1005" y="1000" class="note">2. 管户的科室经理审批。</text>
    <text x="1005" y="1026" class="note">3. 抄送对象：联系人科室经理、总监、固定人员杜佳蔚。</text>
    <text x="1005" y="1052" class="tiny">说明：此节点为条件型流程，未开启时可跳过进入议题审批。</text>
