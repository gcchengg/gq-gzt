    <text x="650" y="1971" text-anchor="middle" class="node-sub">操作：提交</text>
    <text x="650" y="1994" text-anchor="middle" class="tiny">关闭表决建议单任务，发送三会反馈督办任务</text>
  </g>

  <!-- Notes -->
  <g>
    <rect x="980" y="165" width="680" height="165" rx="10" fill="#0f172a"/>
    <rect x="980" y="165" width="680" height="165" rx="10" fill="rgba(6,78,59,0.32)" stroke="#34d399" stroke-width="1.5"/>
    <text x="1005" y="194" class="note-title">议题资料传达：提交后自动派发</text>
    <text x="1005" y="223" class="note">1. 给董监高角色发送议题反馈建议任务</text>
    <text x="1005" y="249" class="note">2. 给财务 / 法务 / 投资 / 综合管理 / 党群联系人发送初审任务</text>
    <text x="1005" y="275" class="note">3. 给管户科室经理、总监发送初审任务</text>
    <text x="1005" y="301" class="note">4. 发送管户议题评估任务</text>
  </g>

  <g>
    <rect x="980" y="358" width="680" height="115" rx="10" fill="#0f172a"/>
