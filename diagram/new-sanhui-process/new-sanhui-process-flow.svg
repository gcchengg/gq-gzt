    <polygon points="650,1120 728,1180 650,1240 572,1180" fill="rgba(120,53,15,0.30)" stroke="#fbbf24" stroke-width="1.8"/>
    <text x="650" y="1177" text-anchor="middle" class="node-sub">是否开启</text>
