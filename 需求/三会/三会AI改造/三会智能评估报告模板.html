<!doctype html>
<html lang="zh-CN">
<head>

  <title>三会模型智能评估报告</title>
  <style>
    :root{--blue:#08389d;--blue2:#174db7;--ink:#10234a;--muted:#65728a;--line:#b9c9e9;--pale:#f3f7ff;--paper:#fff;--warn:#b56b00;--warnbg:#fff8e7;--bad:#b62d3b;--badbg:#fff1f3;--good:#087754;--goodbg:#eaf8f2;--shadow:0 18px 54px rgba(17,53,120,.12)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#eaf0f9;color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;line-height:1.65}
    button,input,textarea{font:inherit}.toolbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px max(18px,calc((100vw - 1440px)/2));background:rgba(8,35,86,.94);backdrop-filter:blur(12px);color:#fff;box-shadow:0 4px 18px rgba(0,0,0,.14)}
    .toolbar-title{font-weight:700;margin-right:auto;white-space:nowrap}.tool-btn{border:1px solid rgba(255,255,255,.5);border-radius:8px;background:transparent;color:#fff;padding:7px 14px;cursor:pointer}.tool-btn:hover{background:rgba(255,255,255,.12)}.file-label{background:#fff;color:var(--blue);border-color:#fff;font-weight:700}.file-label input{display:none}
    .report{width:min(1440px,calc(100% - 32px));margin:24px auto 48px;background:var(--paper);box-shadow:var(--shadow);padding:46px 48px 38px;min-height:900px}
    .head{display:flex;align-items:flex-start;gap:30px}.head-copy{flex:1;min-width:0}.eyebrow{font-size:13px;letter-spacing:.16em;color:var(--blue2);font-weight:700;margin-bottom:6px}.topic{font-size:34px;line-height:1.25;color:var(--blue);margin:0;font-weight:800}.brand{display:flex;align-items:center;gap:12px;color:var(--blue);padding-top:2px}.brand-mark{width:78px;height:48px;border:4px double var(--blue);border-radius:50%;display:grid;place-items:center;font-size:21px;font-weight:900;letter-spacing:-2px}.brand-cn{font-size:22px;line-height:1.1;font-weight:800;white-space:nowrap}.brand-en{font-size:11px;letter-spacing:.08em}.blue-rule{height:6px;background:var(--blue);margin:22px 0 14px}.intro{font-size:20px;font-weight:650;color:#153b88;margin:0 0 10px}.conclusion-line{display:flex;align-items:center;gap:12px;margin:14px 0 18px;font-size:22px;font-weight:800;color:var(--blue)}
    .status{display:inline-flex;align-items:center;border-radius:999px;padding:4px 14px;font-size:15px}.status.insufficient{color:var(--warn);background:var(--warnbg);border:1px solid #f0ca73}.status.pass{color:var(--good);background:var(--goodbg);border:1px solid #8fd3ba}.status.fail{color:var(--bad);background:var(--badbg);border:1px solid #efacb5}
    .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0 0 20px}.metric{border:1px solid var(--line);background:var(--pale);border-radius:10px;padding:12px 15px}.metric-label{font-size:12px;color:var(--muted)}.metric-value{font-size:20px;font-weight:800;color:var(--blue)}
    .board-section{display:grid;grid-template-columns:58px 1fr;gap:10px;margin:12px 0}.rail{border:2px solid var(--blue2);border-radius:20px;display:flex;align-items:center;justify-content:center;color:var(--blue);font-size:18px;font-weight:800;writing-mode:vertical-rl;letter-spacing:.16em;padding:13px 0;background:#fbfdff}.panel{border:2px solid var(--blue2);border-radius:16px;min-height:132px;padding:16px 20px;background:linear-gradient(135deg,#fff 55%,#f6f9ff)}
    .panel.empty{display:flex;align-items:center;color:var(--muted)}.section-list{margin:0;padding-left:23px}.section-list li{margin:5px 0}.count-note{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:0;writing-mode:horizontal-tb;position:absolute;opacity:0}
    .item-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.finding{border-left:4px solid #d89a1b;background:#fffaf0;padding:9px 12px;border-radius:6px}.finding-title{display:flex;gap:8px;align-items:flex-start;font-weight:700}.finding-id{flex:none;color:var(--blue)}.finding-text{font-size:13px;color:#4d5870;margin-top:3px}.score{font-variant-numeric:tabular-nums;color:var(--blue);font-weight:700}
    .detail-area{margin-top:34px;border-top:5px solid var(--blue);padding-top:22px}.detail-title{font-size:24px;color:var(--blue);margin:0 0 14px}.subheading{font-size:19px;color:var(--blue);margin:26px 0 10px}.rule-table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}.rule-table{border-collapse:collapse;width:100%;min-width:920px}.rule-table th{background:#eaf1ff;color:var(--blue);text-align:left;font-size:13px;padding:10px;position:sticky;top:0}.rule-table td{border-top:1px solid #dce5f4;padding:10px;vertical-align:top;font-size:13px}.decision{white-space:nowrap;font-weight:700}.decision.pass{color:var(--good)}.decision.fail{color:var(--bad)}.decision.insufficient{color:var(--warn)}
    details{border:1px solid #d9e2f2;border-radius:10px;margin:8px 0;background:#fff}summary{cursor:pointer;padding:11px 14px;color:var(--blue);font-weight:700}.details-body{padding:0 15px 14px}.label{color:var(--muted);font-size:12px;margin-top:9px}.quote{border-left:3px solid #9fb6e4;background:#f6f9ff;padding:8px 11px;margin:6px 0;font-size:13px}.quote-source{color:var(--blue);font-weight:700;font-size:12px}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px}.info-box{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:#fbfdff}.info-box ul{margin:0;padding-left:20px}.doc-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.doc{display:flex;gap:10px;align-items:center;border:1px solid #dce5f4;border-radius:8px;padding:9px 11px}.dot{width:9px;height:9px;border-radius:50%;background:var(--good);flex:none}.dot.bad{background:var(--bad)}.doc-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.doc-method{margin-left:auto;color:var(--muted);font-size:11px;white-space:nowrap}.quality{border:1px solid #efd28f;background:var(--warnbg);border-radius:10px;padding:13px 16px;margin-top:18px}.quality strong{color:#875200}.quality ul{margin:6px 0 0;padding-left:20px}
    .resolution{display:flex;align-items:center;gap:14px;margin-top:22px;color:var(--blue);font-size:19px;font-weight:800}.check{width:21px;height:21px;border:4px solid var(--blue);display:inline-block}.page-no{text-align:right;color:var(--blue);font-weight:800;font-size:20px}.empty-state{padding:34px;text-align:center;color:var(--muted)}
    dialog{border:0;border-radius:14px;box-shadow:0 24px 80px rgba(0,0,0,.3);width:min(760px,calc(100% - 30px));padding:0}dialog::backdrop{background:rgba(5,20,52,.62)}.dialog-head{padding:16px 20px;background:var(--blue);color:#fff;font-weight:700}.dialog-body{padding:18px}.dialog-body textarea{width:100%;height:360px;border:1px solid var(--line);border-radius:8px;padding:12px;font-family:ui-monospace,monospace;font-size:12px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.dialog-actions button{padding:8px 18px;border-radius:8px;border:1px solid var(--blue);cursor:pointer}.primary{background:var(--blue);color:#fff}.error{display:none;background:#fff0f2;color:#a21e32;padding:9px 14px;text-align:center}.drop-active:after{content:"松开以载入 JSON";position:fixed;inset:10px;z-index:99;border:4px dashed #fff;background:rgba(8,56,157,.82);color:#fff;display:grid;place-items:center;font-size:30px;font-weight:800;border-radius:20px}
    @media(max-width:800px){.toolbar-title{display:none}.report{width:100%;margin:0;padding:25px 14px}.head{display:block}.brand{margin-top:18px}.topic{font-size:25px}.intro{font-size:16px}.metrics{grid-template-columns:repeat(2,1fr)}.board-section{grid-template-columns:42px 1fr}.rail{font-size:14px}.item-grid,.two-col,.doc-list{grid-template-columns:1fr}.panel{padding:13px}.toolbar{overflow:auto}.tool-btn{white-space:nowrap}}
    @media print{@page{size:A4 landscape;margin:10mm}body{background:#fff}.toolbar,.error{display:none!important}.report{width:100%;margin:0;padding:0;box-shadow:none}.panel{break-inside:avoid}.detail-area{break-before:page}.rule-table th{position:static}.rule-table-wrap{overflow:visible}.rule-table{min-width:0}.doc-list{grid-template-columns:1fr 1fr}details{break-inside:avoid}details>.details-body{display:block!important}.page-no{display:none}}
  </style>

<body>

  <script>
    const initialData={"bizId":"富维2026预算-测试2","code":200,"message":"分析完成","data":{"报告":{"总体结论":"待补证","结论说明":"根据已提交材料，对富维公司2026年度财务预算议案的辅助评估结论为待补证。合规性方面，规则2（外部管理规定/董事会权限）已依据公司章程第114条确认为通过；规则1（内部管理规定）、规则3（国资控股股东要求）、规则4（审议程序）仍因缺少制度原文、股东要求文件或前置会议纪要，判断为证据不足。根据业务提示词，任一关键合规项证据不足，整体不得给出通过或不通过。合理性方面，规则7至规则9已可依据议案及预算汇报中的收入、利润数据完成判断并计分（已确认加权得分合计26.67分，对应权重30）；规则5、规则6因缺少可比公司或行业2026年预测，规则10因缺少投资分类及股权公司正式目标，仍为证据不足（待核权重70）。建议补齐规则1、3、4及规则5、6、10所需材料后再行完整评估。","得分汇总":{"已确认得分":26.67,"待核权重":70,"综合得分":null},"逐项分析":[{"规则编号":"规则1","判断":"证据不足","加权得分":null,"计算过程":"不适用","依据":[{"文件名":"2.富维股份十一届十五次董事会-会议材料 - 审议议题.pdf","页码":null,"原文":"关于公司2026年度财务预算的议案"},{"文件名":"富维公司2025年财务预算情况汇报V14.pdf","页码":null,"原文":""}],"信息缺口":"未提供富维公司适用于年度财务预算事项的内部管理制度原文。","补证建议":"请提供富维公司关于年度财务预算编制、审批、调整、考核等环节的内部管理规定文件，以便逐项核对议案内容是否符合内部管理要求。"},{"规则编号":"规则2","判断":"通过","加权得分":null,"计算过程":"否决项，按是否符合判断，不计分。核对公司章程第114条董事会职权，确认年度财务预算方案属于董事会审议范围；材料未见与本议案冲突的外部禁止性规定。","依据":[{"文件名":"富维公司公司章程.pdf","页码":29,"原文":"决定公司的年度财务预算方案；"}],"信息缺口":"无","补证建议":"无。如后续收集到行业或国资专项预算监管文件，可作补充归档，不改变本次权限判断。"},{"规则编号":"规则3","判断":"证据不足","加权得分":null,"计算过程":"不适用","依据":[{"文件名":"2.富维股份十一届十五次董事会-会议材料 - 审议议题.pdf","页码":null,"原文":""}],"信息缺口":"1. 未提供明确的控股股东性质认定文件（如最新的股权结构图、股东名册）。2. 未提供适用于本次预算事项的国资控股股东具体管理要求文件（如国资预算管理办法、股东对下属公司预算的审批或备案规定）。","补证建议":"1. 请提供证明公司控股股东性质（如是否为国有控股）的文件。2. 请提供控股股东（如一汽集团、吉林省国资委等）关于下属公司年度财务预算编制、上报、审核、批复等方面的具体管理制度或要求文件。"},{"规则编号":"规则4","判断":"证据不足","加权得分":null,"计算过程":"不适用","依据":[{"文件名":"2.富维股份十一届十五次董事会-会议材料 - 审议议题.pdf","页码":null,"原文":""}],"信息缺口":"材料中提及了党委会、总办会等前置审议流程，但未提供相关会议纪要、审批单等可核验的记录。","补证建议":"请提供本次2026年度财务预算议案在提交董事会审议前，按规定应履行的党委会、总经理办公会等前置审议程序的会议纪要或审批文件，以证明程序合规。"},{"规则编号":"规则5","判断":"证据不足","加权得分":null,"计算过程":"富维2026年预算收入增长率 = (2026年预算收入 - 2025年预计收入) / 2025年预计收入 * 100% = (198 - 198) / 198 * 100% = 0%。\n可比对象（如华域汽车）2026年预计收入增长率数据缺失。\n原始分 = (富维增长率 / 可比对象增长率) * 100，因分母缺失无法计算。","依据":[{"文件名":"2.富维股份十一届十五次董事会-会议材料 - 审议议题.pdf","页码":null,"原文":"2025年预测：...营业收入198亿...2026年目标预算：...营业收入198亿"},{"文件名":"华域汽车2025年年报.pdf","页码":null,"原文":"（年报仅包含历史会计政策，未提供2026年预测数据）"}],"信息缺口":"未提供任何业务可比公司（如华域汽车）或行业2026年同期的收入预计增速数据。华域汽车2025年年报仅包含历史数据，无2026年预测。","补证建议":"请提供至少一家业务可比公司（如华域汽车）发布的2026年度收入预测数据，或权威行业研究机构发布的2026年汽车零部件行业收入增长率预测报告。"},{"规则编号":"规则6","判断":"证据不足","加权得分":null,"计算过程":"富维2026年预算归母净利润增长率 = (2026年预算归母净利润 - 2025年预计归母净利润) / 2025年预计归母净利润 * 100% = (4.8 - 4.5) / 4.5 * 100% ≈ 6.67%。\n可比对象（如华域汽车）2026年预计归母净利润增长率数据缺失。\n原始分 = (富维增长率 / 可比对象增长率) * 100，因分母缺失无法计算。","依据":[{"文件名":"2.富维股份十一届十五次董事会-会议材料 - 审议议题.pdf","页码":null,"原文":"2025年预测：...归母净利完成4.5亿...2026年目标预算：...归母净利4.8亿"},{"文件名":"华域汽车2025年年报.pdf","页码":null,"原文":"（年报仅包含历史会计政策，未提供2026年预测数据）"}],"信息缺口":"未提供任何可比公司（如华域汽车）或行业2026年归母净利润的预计增长率数据。","补证建议":"请提供至少一家业务可比公司（如华域汽车）发布的2026年度归母净利润预测数据，或权威行业研究机构发布的2026年行业归母净利润增长率预测报告。"},{"规则编号":"规则7","判断":"通过","加权得分":10,"计算过程":"2024年同口径收入：197.0亿元（预算汇报，客户口径预计实现值，作为与2025/2026对比的同口径近似）。\n2025年预计收入：198亿元（董事会议案预计完成值）。\n2026年预算收入：198亿元（董事会议案目标预算）。\nM = (198 - 198) / 198 × 100% = 0%。\nN = (198 - 197.0) / 197.0 × 100% ≈ 0.51%。\n若机械计算 M/N×100 = 0，但N接近零且M、N均属持平区间、增长方向一致，不机械套用比例。\n原始分 = 100（趋势匹配），权重 = 10，加权得分 = 10。","依据":[{"文件名":"2.富维股份十一届十五次董事会-会议材料 - 审议议题.pdf","页码":13,"原文":"2025年预测：产量331万辆，营业收入198亿……2026年目标预算：产量330万辆；营业收入198亿。"},{"文件名":"富维公司2025年财务预算情况汇报V14.pdf","页码":12,"原文":"2024年客户预计实现产量318.2万辆，预计实现营业收入197.0亿"}],"信息缺口":"无","补证建议":"无。如后续取得2024年经审计合并收入，可复核与197.0亿元预计值的口径差异，预计不影响持平结论。"},{"规则编号":"规则8","判断":"通过","加权得分":6.67,"计算过程":"2025年预计归母净利润：4.5亿元（董事会议案；预算汇报待审值一致）。\n2026年预算归母净利润：4.8亿元。\nM = (4.8 - 4.5) / 4.5 × 100% ≈ 6.67%。\n预算汇报载明2025年待审归母净利4.5亿元、可比同比+10%，故2024年同口径 = 4.5 / 1.10 ≈ 4.0909亿元，N = 10%。\n原始分 = min(100, M/N×100) = 6.67 / 10 × 100 = 66.67。\n权重 = 10，加权得分 = 6.67。\n说明：2024年“预计完成归母净利4.72亿元”未说明是否已剔除财司项目等一次性影响，不作为N的分母。","依据":[{"文件名":"2.富维股份十一届十五次董事会-会议材料 - 审议议题.pdf","页码":9,"原文":"归母净利完成4.5亿"},{"文件名":"2.富维股份十一届十五次董事会-会议材料 - 审议议题.pdf","页码":13,"原文":"归母净利4.8亿"},{"文件名":"富维公司2025年财务预算情况汇报V14.pdf","页码":8,"原文":"2025年待审利润总额9.0亿，可比同比+10.4%，待审归母净利4.5亿，可比同比+10%"}],"信息缺口":"无","补证建议":"无。如需进一步核验，可补充2024年可比口径归母净利润的计算底稿，与4.09亿元反推值交叉核对。"},{"规则编号":"规则9","判断":"通过","加权得分":10,"计算过程":"连续三年归母净利润：\n2024年预计完成4.72亿元（盈利）；\n2025年预计完成4.5亿元（盈利）；\n2026年预算4.8亿元（盈利）。\n三年均未亏损，不构成连续3年以上亏损。\n原始分 = 100，权重 = 10，加权得分 = 10。\n投资分类（战略类/培育期等）仅在连续亏损分支下适用，本次不触发。","依据":[{"文件名":"2.富维股份十一届十五次董事会-会议材料 - 审议议题.pdf","页码":9,"原文":"归母净利完成4.5亿"},{"文件名":"2.富维股份十一届十五次董事会-会议材料 - 审议议题.pdf","页码":13,"原文":"归母净利4.8亿"},{"文件名":"富维公司2025年财务预算情况汇报V14.pdf","页码":7,"原文":"预计完成归母净利4.72亿，目标完成83%"}],"信息缺口":"无","补证建议":"无"},{"规则编号":"规则10","判断":"证据不足","加权得分":null,"计算过程":"无法计算。\n1. 投资分类不明：未明确一汽旗翼等投资在富维公司报表中属于“长期股权投资”还是“其他权益工具投资/交易性金融资产”。\n2. 正式目标缺失：未提供股权运营部正式下达的针对相关投资的2026年度投资收益目标文件。\n3. 预算指标关联不明：虽议案提及“飞行汽车项目公允价值变动导致归母净利增加1亿元”，但未明确此1亿元是否全部或部分对应股权公司下达的投资收益目标，亦未提供其与预算中“合联营公司投资收益”等项目的勾稽关系。","依据":[{"文件名":"2.富维股份十一届十五次董事会-会议材料 - 审议议题.pdf","页码":null,"原文":"飞行汽车项目公允价值变动导致归母净利增加1亿元...关于对一汽旗翼（深圳）科技有限公司增资项目实施的议案"}],"信息缺口":"1. 投资分类资料缺失。2. 股权运营部正式下达的2026年投资收益目标文件缺失。3. 预算中投资收益具体构成及与股权公司目标的对应关系不清晰。","补证建议":"1. 请提供富维公司对一汽旗翼等主要股权投资项目的会计分类说明（长期股权投资或其他）。2. 请提供股权运营部（或相应控股股东/管理部门）正式下达的、针对富维公司2026年度的投资收益考核目标文件。3. 请说明2026年预算中“合联营公司投资收益”等项目的具体构成，以及与股权公司下达目标的对应关系。"}],"材料冲突":["2025年客户产量数据冲突：董事会材料中2025年预计客户产量为331万辆（《2.富维股份十一届十五次董事会-会议材料 - 审议议题.pdf》），而2025年预算汇报文件中2025年客户计划产量为354.5万辆（《富维公司2025年财务预算情况汇报V14.pdf》）。两者均为“预计”或“计划”，但数值差异显著，需澄清哪个是用于2025年预计完成值（198亿收入）和2026年预算（198亿收入）的基准产量。","2025年利润总额数据版本冲突：预算汇报文件中提及“2025年三稿预算利润总额为8.15亿，目前内部预算系统为7.52亿”（《富维公司2025年财务预算情况汇报V14.pdf》），而董事会材料及同一份预算汇报中又显示“2025年待审利润总额9.0亿”（《富维公司2025年财务预算情况汇报V14.pdf》）和“2025年预测...利润总额按计划完成9.0亿”（《2.富维股份十一届十五次董事会-会议材料 - 审议议题.pdf》）。存在多个预算版本，最终审议依据的9.0亿与内部系统值7.52亿差异较大，需明确以哪个为准。","2024年归母净利润存在两个口径：预算汇报2024年“预计完成归母净利4.72亿”，与按2025年待审归母净利4.5亿、可比同比+10%反推的同口径约4.09亿元不一致。规则8评分已采用可比口径4.09亿元，4.72亿元不作为同比分母。"],"待补材料":["富维公司内部预算管理制度文件。","控股股东性质认定文件及国资股东对预算的具体管理要求文件。","本次预算议案的前置审议程序（如党委会、总办会）会议纪要或审批记录。","业务可比公司（如华域汽车）2026年度收入及归母净利润预测报告，或行业2026年增长率预测报告。","对一汽旗翼等主要股权投资项目的投资性质分类说明文件。","股权运营部（或相应股东单位）正式下达的2026年度投资收益考核目标文件。","2026年预算中“客户降价”、“成本控制”等关键驱动因素的具体定义、计算范围及假设说明。","2026年投资计划中“新增投资计划32,522万元”与“概算43,416万元”之间关系的详细说明及确认标准。"],"影响分析":["合规性尚未闭合：规则2已确认董事会具备预算审议权限，但规则1、3、4仍为证据不足。若内部制度、股东要求或前置程序存在瑕疵而强行上会，仍可能导致决议效力风险。","合理性已部分量化：规则7显示2026年收入预算与近年持平趋势一致（加权10分）；规则8显示归母净利润预算增速6.67%，低于2025年可比增速10%（原始分66.67，加权6.67分）；规则9确认不构成连续三年亏损（加权10分）。规则5、6横向对标及规则10投资收益达标情况仍无法评分，完整合理性画像尚未形成。","数据口径仍需在上会说明中统一：2025年产量、利润总额存在多版本。规则7、8已分别选用董事会议案预计完成值和预算汇报可比口径，与其他版本并存，建议财务部门在汇报中明确最终审议口径。","关键假设披露不足：预算中关于“客户降价”、“成本控制”、“飞行汽车项目公允价值变动”等利润驱动因素的测算依据仍不足，董事难以评估相关风险对已确认利润增速的影响。"],"管理建议":["建议暂缓正式表决：在规则1、3、4等关键合规材料补齐前，不宜对议案作出通过或不通过的正式决议。","已确认事项可写入审议要点：董事会对本议案有权审议；2026年收入预算持平；归母净利润温和增长但低于上年可比增速；不存在连续三年亏损。上述事实可作为董事提问和会议记录的已核实内容。","优先补齐高权重缺口：规则5、6、10合计待核权重70，对综合得分影响最大。其中规则10权重60，需尽快明确投资分类并取得股权运营部下达的2026年投资收益目标。","规范数据口径与版本管理：建议财务部门在预算说明中统一收入、利润的历史实际值、预计完成值和预算值口径，并披露同比计算所采用的基期数据及其来源。","加强关键预算假设披露：建议补充客户降价幅度、成本降本目标和股权投资公允价值变动的测算依据及敏感性分析。"]},"已确认事项":[{"规则编号":"规则2","类别":"合规性","维度":"实质合规","事项":"外部管理规定","判断":"通过","得分":null,"权重分值":null,"结论":"通过。公司章程第114条载明董事会职权包括“决定公司的年度财务预算方案”，本议案属于董事会审议权限。材料中未见与年度财务预算相冲突的外部禁止性规定；对董事会审议预算方案的权限内核，章程依据已足够确认。本项为否决项，判断为通过，不计权重分。","引用":[{"文件名":"富维公司公司章程.pdf","页码":29,"原文":"决定公司的年度财务预算方案；"}]},{"规则编号":"规则7","类别":"合理性","维度":"预算指标纵向对比","事项":"富维历史收入增长率对比","判断":"通过","得分":10,"权重分值":10,"结论":"通过。2026年预算营业收入198亿元相对2025年预计营业收入198亿元，增长率M=0%；2025年预计收入相对2024年同口径收入197.0亿元，增长率N≈0.51%。两年增速均落在持平区间（绝对值低于1%），增长方向一致。近零分母不宜机械套用M/N得出0分。按趋势匹配，原始分100，权重10，加权得分10。","引用":[{"文件名":"2.富维股份十一届十五次董事会-会议材料 - 审议议题.pdf","页码":13,"原文":"2025年预测：产量331万辆，营业收入198亿……2026年目标预算：产量330万辆；营业收入198亿。"},{"文件名":"富维公司2025年财务预算情况汇报V14.pdf","页码":12,"原文":"2024年客户预计实现产量318.2万辆，预计实现营业收入197.0亿"}]},{"规则编号":"规则8","类别":"合理性","维度":"预算指标纵向对比","事项":"富维历史归母净利润增长率对比","判断":"通过","得分":6.67,"权重分值":10,"结论":"通过。2026年预算归母净利润4.8亿元相对2025年预计4.5亿元，增长率M≈6.67%。预算汇报载明2025年待审归母净利4.5亿元、可比同比+10%，据此反推2024年同口径归母净利润约4.09亿元，N=10%。原始分=M/N×100≈66.67，权重10，加权得分6.67。2024年“预计完成归母净利4.72亿元”为非可比口径，不作为N的分母。","引用":[{"文件名":"2.富维股份十一届十五次董事会-会议材料 - 审议议题.pdf","页码":9,"原文":"归母净利完成4.5亿"},{"文件名":"2.富维股份十一届十五次董事会-会议材料 - 审议议题.pdf","页码":13,"原文":"归母净利4.8亿"},{"文件名":"富维公司2025年财务预算情况汇报V14.pdf","页码":8,"原文":"2025年待审利润总额9.0亿，可比同比+10.4%，待审归母净利4.5亿，可比同比+10%"}]},{"规则编号":"规则9","类别":"合     function loadObject(obj){try{if(typeof obj==="string")obj=JSON.parse(obj);if(!obj.data||!obj.data["报告"])throw new Error("JSON中缺少 data.报告");$("#error").style.display="none";render(obj)}catch(e){const n=$("#error");n.textContent="解析失败："+e.message;n.style.display="block"}}
