<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>参股公司全盘风险扫描 · 风险扫描报告</title>
  <style>
    :root {
      --brand: rgb(46, 80, 201);
      --brand-strong: #2456d3;
      --brand-soft: #edf3ff;
      --ink: #1f2937;
      --muted: #7b879b;
      --line: #e6ebf4;
      --page: #f4f7fc;
      --card: #ffffff;
      --shadow: 0 10px 30px rgba(49, 79, 150, .08);
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-width: 1180px; min-height: 100%; font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; color: var(--ink); background: var(--page); }
    button, input, select { font: inherit; }
    button { border: 0; cursor: pointer; }
    .app { min-height: 100vh; }
    .topbar { height: 54px; display: flex; align-items: center; padding: 0 16px 0 20px; background: #fff; border-bottom: 1px solid #e9edf4; position: sticky; top: 0; z-index: 20; }
    .brand { width: 220px; display: flex; align-items: center; gap: 10px; padding-right: 22px; }
    .brand img { width: 172px; max-height: 32px; object-fit: contain; object-position: left center; }
    .topnav { display: flex; align-items: center; gap: 3px; height: 100%; }
    .topnav-item { height: 32px; padding: 0 14px; display: inline-flex; align-items: center; gap: 7px; color: #4f5663; border-radius: 8px; background: transparent; font-size: 13px; }
    .topnav-item:hover, .topnav-item.is-active { color: var(--brand); background: #f3f6ff; }
    .topnav-item .icon { width: 15px; height: 15px; display: inline-flex; align-items: center; justify-content: center; line-height: 1; }
    .topnav-item .icon svg { width: 15px; height: 15px; display: block; }
    .topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; color: #687286; }
    .action-icon { position: relative; width: 23px; height: 24px; display: grid; place-items: center; font-size: 18px; background: transparent; color: #667085; }
    .action-icon > svg { width: 16px; height: 16px; display: block; }
    .badge { position: absolute; top: -3px; right: -5px; min-width: 17px; height: 15px; padding: 0 4px; border-radius: 99px; color: #fff; background: #ff4d5d; font-size: 9px; line-height: 15px; }
    .avatar { width: 27px; height: 27px; padding: 0; border-radius: 50%; display: grid; place-items: center; overflow: hidden; background: #e7e3e0; color: white; font-size: 15px; box-shadow: inset 0 0 0 2px #f0f2f5; }
    .avatar img { width: 100%; height: 100%; display: block; object-fit: cover; }
    .more { font-size: 18px; transform: translateY(-2px); }
    .body { position: relative; display: flex; min-height: calc(100vh - 54px); }
    .sidebar { width: 240px; flex: 0 0 240px; min-width: 0; overflow: hidden; background: #fff; border-right: 1px solid #e7ebf2; transition: width .2s ease, flex-basis .2s ease, border-color .2s ease; }
    .sidebar-toggle { position: absolute; top: 50%; left: 240px; z-index: 12; width: 20px; height: 44px; transform: translate(-50%, -50%); display: grid; place-items: center; padding: 0; border: 1px solid #e3e8f2; border-left: 0; border-radius: 0 10px 10px 0; background: #fff; color: #8b97aa; font-size: 18px; line-height: 1; box-shadow: 0 4px 12px rgba(41, 62, 107, .08); transition: left .2s ease, transform .2s ease, background .2s ease, color .2s ease; }
    .sidebar-toggle:hover { color: var(--brand-strong); background: #f5f8ff; }
    .body.sidebar-collapsed .sidebar { width: 0; flex-basis: 0; border-right: 0; }
    .body.sidebar-collapsed .sidebar-toggle { left: 0; transform: translate(0, -50%); border-left: 1px solid #e3e8f2; }
    .sidebar-head { height: 58px; display: flex; align-items: center; padding: 0 24px; border-bottom: 1px solid var(--line); font-size: 17px; font-weight: 700; }
    .side-search { height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; color: #656f80; font-size: 14px; }
    .side-search span:last-child { font-size: 20px; }
    .nav { padding: 3px 0 24px; }
    .nav-section { margin: 0; }
    .nav-title, .nav-link { min-height: 45px; display: flex; align-items: center; padding: 0 24px 0 27px; color: #39404c; font-size: 14px; }
    .nav-title { justify-content: space-between; font-weight: 500; cursor: pointer; }
    .nav-title:hover, .nav-link:hover { background: #f5f8ff; color: var(--brand); }
    .nav-title .chevron { font-size: 16px; color: #6b7280; transition: transform .2s ease; }
    .nav-title.is-collapsed .chevron { transform: rotate(-90deg); }
    .nav-children { overflow: hidden; transition: max-height .25s ease; }
    .nav-children.is-collapsed { max-height: 0 !important; }
    .nav-link { padding-left: 50px; position: relative; cursor: pointer; }
    .nav-link.is-active { color: var(--brand-strong); background: #eaf1ff; font-weight: 600; }
    .nav-link.is-active::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: #2e76f6; border-radius: 0 3px 3px 0; }
    .nav-section + .nav-section { border-top: 1px solid #f2f4f8; margin-top: 8px; padding-top: 5px; }
    .main { min-width: 0; flex: 1; padding: 0 20px 24px; overflow: hidden; }
    .worktab { height: 55px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #e5eaf3; }
    .tab { height: 38px; display: inline-flex; align-items: center; gap: 9px; padding: 0 12px 0 10px; border-radius: 10px 10px 0 0; background: transparent; color: #61718c; font-size: 13px; cursor: pointer; }
    .tab.is-active { color: var(--brand-strong); background: #fff; box-shadow: 0 -1px 0 #e8eef9, 0 1px 0 #fff; }
    .tab-dot { width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; color: #5c7096; background: transparent; font-size: 0; }
    .tab-dot svg { width: 19px; height: 19px; display: block; }
    .tab-close { margin-left: 2px; font-size: 15px; color: #98a2b3; }
    .worktab-actions { margin-left: auto; display: flex; align-items: center; gap: 1px; padding: 2px; border-radius: 8px; background: #f5f7fc; }
    .worktab-actions .action-icon { width: 28px; height: 26px; border-radius: 7px; color: #687690; }
    .worktab-actions .action-icon:hover { color: var(--brand-strong); background: #fff; }
    .content { padding-top: 18px; }
    .page-intro { display: flex; align-items: flex-end; justify-content: space-between; margin: 0 3px 15px; }
    .eyebrow { color: #8b97aa; font-size: 12px; margin-bottom: 6px; }
    h1 { margin: 0; font-size: 22px; letter-spacing: -.02em; }
    .version { margin-left: 10px; color: #98a2b3; font-size: 12px; font-weight: 400; }
    .intro-actions { display: flex; gap: 10px; }
    .btn { height: 36px; padding: 0 15px; border-radius: 10px; border: 1px solid #dce5f5; background: #fff; color: #52627a; font-size: 13px; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 4px 12px rgba(55, 81, 137, .04); }
    .btn:hover { border-color: #b8c9eb; color: var(--brand-strong); }
    .btn-primary { color: #fff; border-color: var(--brand); background: linear-gradient(135deg, #3972dd, #2d56c7); box-shadow: 0 10px 19px rgba(46, 80, 201, .2); }
    .btn-primary:hover { color: #fff; border-color: #1f4bc5; filter: brightness(1.04); }
    .btn-ghost { background: #f7f9fe; border-color: #e0e8f8; }
    .dashboard-shell { background: linear-gradient(145deg, #eef4ff 0%, #f5f8fd 52%, #eff3fb 100%); border: 1px solid #e5ebf6; border-radius: 18px; padding: 25px 24px 28px; min-height: calc(100vh - 170px); }
    .dashboard-layout { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 16px; }
    .card { background: var(--card); border: 1px solid #e8edf6; border-radius: var(--radius); box-shadow: var(--shadow); }
    .company-card { padding: 16px; min-height: 610px; }
    .segmented { display: flex; padding: 4px; background: #edf2fb; border-radius: 14px; gap: 4px; }
    .segmented button { flex: 1; height: 39px; border-radius: 10px; background: transparent; color: #6f7c92; font-weight: 600; font-size: 13px; }
    .segmented button.is-active { background: #fff; color: var(--brand-strong); box-shadow: 0 4px 10px rgba(61, 93, 160, .12); }
    .company-title { display: flex; align-items: center; justify-content: space-between; margin: 18px 0 12px; font-weight: 700; }
    .count-pill { min-width: 43px; height: 28px; padding: 0 10px; display: inline-flex; align-items: center; justify-content: center; border-radius: 99px; color: var(--brand-strong); background: #edf3ff; font-size: 12px; }
    .search-row { display: flex; height: 39px; border: 1px solid #e2eaf7; border-radius: 10px; overflow: hidden; }
    .search-row input { flex: 1; min-width: 0; border: 0; padding: 0 12px; color: var(--ink); outline: none; font-size: 12px; }
    .search-row input::placeholder { color: #a9b3c3; }
    .search-row button { width: 58px; color: #fff; background: #2f6fe5; font-size: 12px; }
    .pager { display: flex; align-items: center; gap: 8px; margin-top: 11px; }
    .pager button, .page-index, .page-size { height: 34px; border: 1px solid #e1e8f5; background: #f8faff; border-radius: 9px; color: #6f7c93; font-size: 12px; }
    .pager button { width: 35px; font-size: 17px; }
    .page-index { flex: 1; display: grid; place-items: center; color: var(--brand-strong); background: #fff; }
    .page-index strong { font-size: 16px; }
    .page-size { width: 96px; padding: 0 10px; display: flex; align-items: center; justify-content: space-between; }
    .empty-box { min-height: 76px; margin-top: 15px; border: 1px dashed #d8e1f0; border-radius: 13px; display: grid; place-items: center; color: #8996aa; font-size: 13px; background: #fbfcfe; }
    .empty-box strong { display: block; margin-bottom: 5px; color: #7a8aa3; font-size: 13px; }
    .small-tip { margin-top: 12px; color: #a1adbe; font-size: 11px; line-height: 1.6; }
    .right-stack { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
    .overview-bar { display: flex; justify-content: flex-end; gap: 9px; }
    .overview-bar .btn { height: 35px; }
    .metric-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .metric { padding: 15px 16px; min-height: 88px; }
    .metric-value { color: var(--brand-strong); font-weight: 700; font-size: 18px; line-height: 1.2; }
    .metric-label { margin-top: 9px; color: #75839a; font-size: 12px; }
    .metric-meta { margin-top: 6px; color: #9ba7b8; font-size: 11px; }
    .filter-card { padding: 18px; }
    .filter-grid { display: grid; grid-template-columns: 180px 155px minmax(160px, 1fr) auto; gap: 12px; align-items: end; }
    .field label { display: block; margin: 0 0 7px 2px; color: #738198; font-size: 12px; }
    .control { width: 100%; height: 40px; padding: 0 12px; border: 1px solid #e0e8f5; border-radius: 10px; background: #fff; color: #3f4b5e; outline: none; }
    select.control { appearance: none; background-image: linear-gradient(45deg, transparent 50%, #8895aa 50%), linear-gradient(135deg, #8895aa 50%, transparent 50%); background-position: calc(100% - 17px) 17px, calc(100% - 12px) 17px; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
    .filter-actions { display: flex; gap: 8px; }
    .filter-actions .btn { height: 40px; }
    .timeline-card { padding: 17px 18px 19px; min-height: 405px; }
    .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .card-head h2 { margin: 0; font-size: 15px; }
    .view-actions { display: flex; gap: 7px; }
    .view-actions button { height: 31px; padding: 0 12px; border-radius: 9px; background: #f1f5fd; color: #71809a; font-size: 12px; }
    .view-actions button.is-active { background: #fff; color: var(--brand-strong); box-shadow: 0 2px 8px rgba(53, 82, 148, .12); }
    .timeline-summary { padding: 14px 16px; border: 1px solid #edf0f7; border-radius: 12px; background: #fbfcff; color: #7d8ba0; font-size: 12px; }
    .timeline-top { display: flex; justify-content: space-between; align-items: center; }
    .timeline-switch { display: flex; gap: 2px; padding: 3px; background: #f2f5fb; border-radius: 9px; }
    .timeline-switch button { height: 25px; padding: 0 10px; border-radius: 7px; background: transparent; color: #76859b; font-size: 11px; }
    .timeline-switch button.is-active { background: #fff; color: var(--brand-strong); box-shadow: 0 2px 6px rgba(50, 79, 145, .1); }
    .progress-track { height: 8px; margin-top: 15px; background: #eaf0fc; border-radius: 99px; overflow: hidden; }
    .progress-track span { display: block; width: 30%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #9fb4e2, #7d9de0); }
    .timeline-grid { display: grid; grid-template-columns: 138px 138px minmax(0, 1fr); margin-top: 13px; border-top: 1px solid #edf1f7; border-left: 1px solid #edf1f7; }
    .timeline-grid > div { min-height: 91px; padding: 15px; border-right: 1px solid #edf1f7; border-bottom: 1px solid #edf1f7; display: flex; align-items: center; }
    .timeline-grid .stage { justify-content: center; background: #eff5ff; color: var(--brand-strong); text-align: center; font-weight: 700; position: relative; }
    .timeline-grid .stage::before { content: ""; position: absolute; top: 14px; left: 50%; width: 8px; height: 8px; transform: translateX(-50%); border-radius: 50%; background: #326ce0; box-shadow: 0 0 0 5px #dfeafe; }
    .timeline-grid .substage { justify-content: center; background: #fafcff; color: #64738d; font-size: 13px; font-weight: 600; }
    .timeline-grid .timeline-empty { justify-content: center; color: #a0aabd; font-size: 12px; }
    .notice { padding: 22px; text-align: center; color: #8795aa; border: 1px dashed #dce5f3; border-radius: 13px; background: rgba(255,255,255,.56); font-size: 13px; }
    .notice strong { display: block; margin-bottom: 7px; color: #657692; }
    .page-placeholder { min-height: calc(100vh - 170px); display: grid; place-items: center; }
    .blank-page { width: 100%; min-height: calc(100vh - 145px); border: 0; border-radius: 0; background: transparent; }
    .placeholder-inner { width: min(620px, 80%); padding: 54px 60px; text-align: center; }
    .placeholder-icon { width: 56px; height: 56px; margin: 0 auto 18px; display: grid; place-items: center; border-radius: 17px; color: var(--brand-strong); background: #e7efff; font-size: 25px; }
    .placeholder-inner h2 { margin: 0 0 9px; font-size: 20px; }
    .placeholder-inner p { margin: 0 auto 21px; max-width: 440px; color: #8a96a8; font-size: 13px; line-height: 1.8; }
    .toast { position: fixed; left: 50%; bottom: 32px; z-index: 50; transform: translate(-50%, 20px); padding: 11px 17px; border-radius: 10px; color: #fff; background: rgba(31, 41, 55, .92); box-shadow: 0 10px 30px rgba(0,0,0,.15); opacity: 0; pointer-events: none; transition: .24s ease; font-size: 13px; }
    .toast.is-show { opacity: 1; transform: translate(-50%, 0); }
    .modal-backdrop { position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center; background: rgba(20, 32, 56, .35); backdrop-filter: blur(3px); }
    .modal-backdrop.is-show { display: flex; }
    .modal { width: 470px; border-radius: 17px; background: #fff; box-shadow: 0 24px 70px rgba(34, 57, 107, .2); overflow: hidden; }
    .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 21px; border-bottom: 1px solid var(--line); }
    .modal-head h3 { margin: 0; font-size: 16px; }
    .modal-close { background: transparent; color: #9aa5b6; font-size: 21px; }
    .modal-body { padding: 20px 21px; }
    .modal-body .field + .field { margin-top: 15px; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 9px; padding: 14px 21px 18px; background: #fafbfe; }
    @media (max-width: 1380px) {
      .sidebar { width: 220px; flex-basis: 220px; }
      .sidebar-toggle { left: 220px; }
      .brand { width: 195px; }
      .brand img { width: 155px; }
      .dashboard-shell { padding: 18px; }
      .dashboard-layout { grid-template-columns: 285px minmax(0, 1fr); }
      .metric-grid { gap: 8px; }
    }
  
    /* === 风险扫描业务样式 === */
    .page-intro h1 .version { display: none; }
    .intro-note { margin: 0 3px 14px; padding: 10px 14px; border-radius: 12px; background: #f3f7ff; border: 1px solid #e2eaf8; color: #667892; font-size: 12px; line-height: 1.7; }
    .metric-grid.risk-metrics { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .metric .metric-value.danger { color: #d4380d; }
    .metric .metric-value.warn { color: #d48806; }
    .filter-grid.risk-filter { grid-template-columns: 140px 160px minmax(180px, 1fr) auto; }
    .table-card { padding: 0; overflow: hidden; }
    .table-card .card-head { padding: 16px 18px 0; margin-bottom: 0; }
    .table-wrap { overflow: auto; max-height: calc(100vh - 420px); margin-top: 8px; }
    table.risk-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12px; min-width: 980px; }
    table.risk-table thead th { position: sticky; top: 0; z-index: 2; background: #f5f8ff; color: #5d6d88; font-weight: 600; text-align: left; padding: 11px 12px; border-bottom: 1px solid #e5ebf6; white-space: nowrap; }
    table.risk-table tbody td { padding: 10px 12px; border-bottom: 1px solid #eef2f8; color: #3f4b5e; vertical-align: middle; }
    table.risk-table tbody tr:hover { background: #f8faff; }
    table.risk-table .col-code { width: 72px; color: #6b7c96; font-variant-numeric: tabular-nums; }
    table.risk-table .col-name { min-width: 160px; }
    .link-rule { color: var(--brand-strong); background: transparent; padding: 0; font-weight: 600; text-align: left; border: 0; cursor: pointer; }
    .link-rule:hover { text-decoration: underline; }
    .chip { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 99px; font-size: 11px; font-weight: 600; }
    .chip-high { color: #cf1322; background: #fff1f0; }
    .chip-mid { color: #d48806; background: #fff7e6; }
    .chip-low { color: #389e0d; background: #f6ffed; }
    .chip-pending { color: #8c8c8c; background: #f5f5f5; margin-left: 6px; }
    .status-cell { display: inline-flex; align-items: center; justify-content: center; min-width: 28px; height: 28px; border-radius: 8px; font-size: 14px; cursor: pointer; border: 1px solid transparent; background: transparent; padding: 0 6px; }
    .status-cell:hover { border-color: #d6e2f8; background: #f5f8ff; }
    .status-trigger { color: #cf1322; font-weight: 700; }
    .status-attention { color: #d48806; font-weight: 700; }
    .status-none { color: #b0bac8; }
    .stats-cell { white-space: nowrap; color: #667892; font-variant-numeric: tabular-nums; }
    .stats-cell .t { color: #cf1322; margin-right: 8px; }
    .stats-cell .a { color: #d48806; }
    .empty-state { padding: 48px 20px; text-align: center; color: #8a96a8; }
    .empty-state strong { display: block; margin-bottom: 8px; color: #657692; font-size: 14px; }
    .detail-shell { display: flex; flex-direction: column; gap: 14px; }
    .detail-hero { padding: 18px 20px; }
    .detail-hero .hero-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .detail-hero h2 { margin: 0 0 8px; font-size: 18px; }
    .detail-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .meta-pill { height: 26px; padding: 0 10px; border-radius: 8px; background: #f1f5fd; color: #5b6c88; font-size: 12px; display: inline-flex; align-items: center; }
    .cond-box { padding: 12px 14px; border-radius: 12px; background: #fafcff; border: 1px solid #edf1f8; color: #5f6f89; font-size: 13px; line-height: 1.7; }
    .cond-box strong { color: #3f4b5e; }
    .concl-box { margin-top: 10px; color: #667892; font-size: 12px; }
    .detail-filter { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .detail-filter .seg { display: flex; padding: 3px; background: #edf2fb; border-radius: 10px; gap: 3px; }
    .detail-filter .seg button { height: 30px; padding: 0 12px; border-radius: 8px; background: transparent; color: #6f7c92; font-size: 12px; font-weight: 600; }
    .detail-filter .seg button.is-active { background: #fff; color: var(--brand-strong); box-shadow: 0 2px 8px rgba(53,82,148,.12); }
    .note-pending { color: #8c8c8c; font-size: 11px; }
    .modal .kv { display: grid; grid-template-columns: 88px 1fr; gap: 8px 10px; font-size: 13px; }
    .modal .kv dt { color: #8a96a8; }
    .modal .kv dd { margin: 0; color: #3f4b5e; word-break: break-word; }
    .dashboard-shell.full { }
    .right-stack.solo { width: 100%; }
    @media (max-width: 1380px) {
      .metric-grid.risk-metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .filter-grid.risk-filter { grid-template-columns: 1fr 1fr; }
      .filter-grid.risk-filter .filter-actions { grid-column: 1 / -1; }
    }

  
    /* === 报告列表 === */
    .filter-grid.list-filter { grid-template-columns: 160px 140px minmax(180px, 1fr) auto; }
    .chip-ok { color: #389e0d; background: #f6ffed; }
    .chip-run { color: #0958d9; background: #e6f4ff; }
    .chip-draft { color: #8c8c8c; background: #f5f5f5; }
    .chip-demo { color: #d48806; background: #fff7e6; margin-left: 6px; }
    .chip-current { color: var(--brand-strong); background: #edf3ff; margin-left: 6px; }
    .breadcrumb-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0 3px 10px; color: #8b97aa; font-size: 12px; }
    .breadcrumb-row a, .breadcrumb-row button.crumb { color: var(--brand-strong); background: transparent; border: 0; padding: 0; cursor: pointer; font-size: 12px; }
    .breadcrumb-row .sep { color: #c0c8d6; }
    .breadcrumb-row .here { color: #5d6d88; font-weight: 600; }
    .list-name { font-weight: 600; color: #3f4b5e; }

      const map = { '已生成': 'chip-ok', '生成中': 'chip-run', '草稿': 'chip-draft' };
      return `<span class="chip ${map[st] || 'chip-draft'}">${esc(st)}</span>`;

      const a = attrs || '';
      if (interactive) {
        return `<button type="button" class="status-cell ${cls}" title="${label}" ${a}>${st}</button>`;
      }
      return `<span class="status-cell ${cls}" title="${label}">${st}</span>`;

      return st === '●' ? '● 触发' : st === '○' ? '○ 关注' : '— 不触发';

                  </select>
                </div>
                <div class="field"><label>关键词</label>
                  <input class="control" id="listKeyword" placeholder="报告名称 / 报告期" value="${esc(f.keyword)}" />
                </div>
                <div class="filter-actions">
                  <button class="btn" type="button" id="listReset">重置</button>
                  <button class="btn btn-primary" type="button" id="listQuery">查询</button>
                </div>
              </div>
            </section>
            <section class="card table-card">
              <div class="card-head"><h2>报告列表</h2><div class="view-actions"><span style="color:#8a96a8;font-size:12px">点击「查看详情」进入该期规则扫描总览</span></div></div>
              <div class="table-wrap">
                ${rows.length ? `
                <table class="risk-table">
                  <thead><tr>
                    <th>报告名称</th><th>报告期</th><th>数据截止</th><th>报告日期</th>
                    <th>规则数</th><th>触发数</th><th>关注数</th><th>状态</th><th>操作</th>
                  </tr></thead>
                  <tbody>${tableBody}</tbody>
                </table>` : `
                <div class="empty-state"><strong>当前筛选条件下暂无报告</strong><span>可重置筛选条件，或调整报告期 / 状态后重新查询。</span></div>`}
              </div>
            </section>
          </div>
        </section>
      </div>`;

      document.getElementById('listQuery')?.addEventListener('click', () => {
        state.listFilters.period = document.getElementById('listPeriod').value;
        state.listFilters.status = document.getElementById('listStatus').value;
        state.listFilters.keyword = document.getElementById('listKeyword').value;
        render();
        const n = filteredReports().length;
        showToast(n ? `已按条件查询，共 ${n} 份报告` : '查询完成，暂无匹配报告');
      });
      document.getElementById('listReset')?.addEventListener('click', () => {
        state.listFilters = { period: '全部', status: '全部', keyword: '' };
        render();
        showToast('筛选条件已重置');
      });
      document.getElementById('listKeyword')?.addEventListener('keydown', e => {
        if (e.key === 'Enter') document.getElementById('listQuery')?.click();
      });
      document.getElementById('genReportBtn')?.addEventListener('click', () => {
        showToast('生成报告功能占位：后续对接报告生成任务');
      });
      document.querySelectorAll('[data-open-report]').forEach(btn => {
        btn.addEventListener('click', () => goOverview(btn.getAttribute('data-open-report')));
      });
    }

    function filteredOverview(RISK_DATA) {
      const { level, status, keyword } = state.filters;
      const kw = (keyword || '').trim().toLowerCase();
      return RISK_DATA.overview.filter(r => {
        if (level !== '全部' && r.level !== level) return false;
        if (status === '有触发' && r.triggerCount <= 0) return false;
        if (status === '有关注' && r.attentionCount <= 0) return false;
        if (kw) {
          const hay = (r.code + ' ' + r.name).toLowerCase();
          if (!hay.includes(kw)) return false;
        }
        return true;
      });
    }

    function renderOverview() {
      const meta = getReportMeta(state.reportId);
      const RISK_DATA = getRiskData();
      if (!meta || !RISK_DATA) { goList(); return; }
      setWorktab(`规则扫描总览 · ${meta.period}`);
      setNavActive('overview');
      const m = RISK_DATA.metrics;
      const companies = RISK_DATA.meta.companies;
      const rows = filteredOverview(RISK_DATA);
      const f = state.filters;
      const demoNote = meta.isDemo ? '｜ 本页为历史期演示数据（结构一致）' : '';

      const tableBody = rows.length ? rows.map(r => {
        const cells = companies.map(co => {
          const st = r.companyStatus[co];
          return `<td>${statusSymbol(st, true, `data-cell-rule="${esc(r.code)}" data-cell-company="${esc(co)}"`)}</td>`;
        }).join('');
        return `<tr>
          <td class="col-code">${esc(r.code)}</td>
          <td class="col-name"><button type="button" class="link-rule" data-goto-rule="${esc(r.code)}">${esc(r.name)}</button></td>
          <td>${levelChip(r.level)}</td>
          ${cells}
          <td class="stats-cell"><span class="t">●${r.triggerCount}</span><span class="a">○${r.attentionCount}</span></td>
        </tr>`;
      }).join('') : '';

      pageHost.innerHTML = `
      <div class="content">
        ${crumb([
          { label: '参股公司全盘风险扫描' },
          { label: '风险扫描报告', action: 'list' },
          { label: meta.period + ' · 规则扫描总览' }
        ])}
        <div class="page-intro">
          <div>
            <div class="eyebrow">参股公司全盘风险扫描 / 规则扫描总览</div>
            <h1>规则扫描总览 · ${esc(meta.period)}</h1>
          </div>
          <div class="intro-actions">
            <button class="btn" type="button" id="backList">← 返回报告列表</button>
            <button class="btn btn-ghost" type="button" id="exportBtn">导出报告</button>
          </div>
        </div>
        <div class="intro-note">${esc(RISK_DATA.meta.desc)}${esc(demoNote)}</div>
        <section class="dashboard-shell">
          <div class="right-stack solo">
            <div class="metric-grid risk-metrics">
              <div class="card metric"><div class="metric-value">${m.ruleCount}</div><div class="metric-label">扫描规则数</div><div class="metric-meta">本报告期规则全集</div></div>
              <div class="card metric"><div class="metric-value danger">${m.triggerTotal}</div><div class="metric-label">触发次数合计</div><div class="metric-meta">跨公司 × 规则</div></div>
              <div class="card metric"><div class="metric-value warn">${m.attentionTotal}</div><div class="metric-label">关注次数合计</div><div class="metric-meta">跨公司 × 规则</div></div>
              <div class="card metric"><div class="metric-value">${m.companyHitCount} / ${m.companyTotal}</div><div class="metric-label">涉及公司数</div><div class="metric-meta">至少有触发或关注</div></div>
            </div>
            <section class="card filter-card">
              <div class="filter-grid risk-filter">
                <div class="field"><label>风险等级</label>
                  <select class="control" id="filterLevel">
                    <option value="全部"${f.level==='全部'?' selected':''}>全部</option>
                    <option value="高"${f.level==='高'?' selected':''}>高</option>
                    <option value="中"${f.level==='中'?' selected':''}>中</option>
                    <option value="低"${f.level==='低'?' selected':''}>低</option>
                  </select>
                </div>
                <div class="field"><label>状态</label>
                  <select class="control" id="filterStatus">
                    <option value="全部"${f.status==='全部'?' selected':''}>全部</option>
                    <option value="有触发"${f.status==='有触发'?' selected':''}>有触发</option>
                    <option value="有关注"${f.status==='有关注'?' selected':''}>有关注</option>
                  </select>
                </div>
                <div class="field"><label>搜索规则名或编号</label>
                  <input class="control" id="filterKeyword" placeholder="例如 R16 或 存货" value="${esc(f.keyword)}" />
                </div>
                <div class="filter-actions">
                  <button class="btn" type="button" id="resetBtn">重置</button>
                  <button class="btn btn-primary" type="button" id="queryBtn">查询</button>
                </div>
              </div>
            </section>
            <section class="card table-card">
              <div class="card-head"><h2>规则扫描矩阵</h2><div class="view-actions"><span style="color:#8a96a8;font-size:12px">点击风险名称下转详情 · 点击状态格查看说明</span></div></div>
              <div class="table-wrap">
                ${rows.length ? `
                <table class="risk-table">
                  <thead><tr>
                    <th>规则编号</th><th>风险名称</th><th>等级</th>
                    ${companies.map(c => `<th>${esc(c)}</th>`).join('')}
                    <th>触发/关注统计</th>
                  </tr></thead>
                  <tbody>${tableBody}</tbody>
                </table>` : `
                <div class="empty-state"><strong>当前筛选条件下暂无匹配规则</strong><span>建议补充：可先恢复“全部”等级与状态后重新查询，或更换关键词。</span></div>`}
              </div>
            </section>
          </div>
        </section>
      </div>`;

      document.querySelectorAll('[data-crumb="list"]').forEach(b => b.addEventListener('click', goList));
      document.getElementById('backList')?.addEventListener('click', goList);
      document.getElementById('queryBtn')?.addEventListener('click', () => {
        state.filters.level = document.getElementById('filterLevel').value;
        state.filters.status = document.getElementById('filterStatus').value;
        state.filters.keyword = document.getElementById('filterKeyword').value;
        render();
        const n = filteredOverview(getRiskData()).length;
        showToast(n ? `已按条件查询，共 ${n} 条规则` : '查询完成，暂无匹配规则');
      });
      document.getElementById('resetBtn')?.addEventListener('click', () => {
        state.filters = { level: '全部', status: '全部', keyword: '' };
        render();
        showToast('筛选条件已重置');
      });
      document.getElementById('exportBtn')?.addEventListener('click', () => showToast('导出报告功能占位：后续对接导出服务'));
      document.getElementById('filterKeyword')?.addEventListener('keydown', e => {
        if (e.key === 'Enter') document.getElementById('queryBtn')?.click();
      });
      bindRuleLinks();
      bindStatusCells();
    }

    function bindRuleLinks() {
      document.querySelectorAll('[data-goto-rule]').forEach(btn => {
        btn.addEventListener('click', () => goDetail(btn.getAttribute('data-goto-rule')));
      });
    }

    function bindStatusCells() {
      document.querySelectorAll('[data-cell-rule]').forEach(btn => {
        btn.addEventListener('click', () => {
          openStatusModal(btn.getAttribute('data-cell-rule'), btn.getAttribute('data-cell-company'));
        });
      });
    }

    function openStatusModal(code, company) {
      const RISK_DATA = getRiskData();
      if (!RISK_DATA) return;
      const rule = RISK_DATA.rules[code];
      const ov = RISK_DATA.overview.find(r => r.code === code);
      if (!rule || !ov) return;
      const row = rule.rows.find(r => r.company === company) || {};
      const st = ov.companyStatus[company] || row.status || '—';
      state.modalCtx = { code, company };
      document.getElementById('modalTitle').textContent = `${company} · ${code}`;
      const pending = hasPendingNote(row.note) ? '<span class="chip chip-pending">待核实</span>' : '';
      const extra = [];
      (rule.headers || []).forEach(h => {
        if (['序号','公司','状态','说明'].includes(h)) return;
        const v = row.values ? row.values[h] : '';
        if (v != null && String(v) !== '') extra.push(`<dt>${esc(h)}</dt><dd>${esc(v)}</dd>`);
      });
      document.getElementById('modalBody').innerHTML = `
        <dl class="kv">
          <dt>风险名称</dt><dd>${esc(rule.name)} ${levelChip(rule.level)}</dd>
          <dt>扫描状态</dt><dd>${esc(statusLabel(st))} ${pending}</dd>
          <dt>说明</dt><dd>${esc(row.note || '暂无补充说明')}</dd>
          ${extra.join('')}
        </dl>`;
      modalBackdrop.classList.add('is-show');
    }

    function closeModal() {
      modalBackdrop.classList.remove('is-show');
      state.modalCtx = null;
    }

    function goList() {
      state.view = 'list';
      state.reportId = null;
      state.ruleCode = null;
      location.hash = 'view=list';
      render();
    }

    function goOverview(reportId) {
      const id = reportId || state.reportId;
      if (!id || !REPORT_PACK.byId[id]) {
        showToast('该报告暂无详情数据');
        return;
      }
      state.view = 'overview';
      state.reportId = id;
      state.ruleCode = null;
      state.filters = { level: '全部', status: '全部', keyword: '' };
      location.hash = `view=overview&report=${encodeURIComponent(id)}`;
      render();
    }

    function goDetail(code) {
      const RISK_DATA = getRiskData();
      if (!RISK_DATA || !RISK_DATA.rules[code]) { showToast('未找到规则详情'); return; }
      state.view = 'detail';
      state.ruleCode = code;
      state.detailStatus = '全部';
      location.hash = `view=detail&report=${encodeURIComponent(state.reportId)}&rule=${encodeURIComponent(code)}`;
      render();
    }

    function renderDetail() {
      const meta = getReportMeta(state.reportId);
      const RISK_DATA = getRiskData();
      const code = state.ruleCode;
      if (!meta || !RISK_DATA || !RISK_DATA.rules[code]) { goOverview(state.reportId); return; }
      const rule = RISK_DATA.rules[code];
      setWorktab(`${rule.title || code} · ${meta.period}`);
      setNavActive('overview');

      let rows = rule.rows.slice();
      if (state.detailStatus === '触发') rows = rows.filter(r => r.status === '●');
      if (state.detailStatus === '关注') rows = rows.filter(r => r.status === '○');
      if (state.detailStatus === '触发或关注') rows = rows.filter(r => r.status === '●' || r.status === '○');

      const headers = rule.headers || [];
      const thead = headers.map(h => `<th>${esc(h)}</th>`).join('');
      const tbody = rows.map(r => {
        return '<tr>' + headers.map(h => {
          if (h === '状态') {
            return `<td>${statusSymbol(r.status, true, `data-cell-rule="${esc(code)}" data-cell-company="${esc(r.company)}"`)} <span style="color:#8a96a8;font-size:11px;margin-left:4px">${esc(statusLabel(r.status).replace(/^[^ ]+ /, ''))}</span></td>`;
          }
          if (h === '说明') {
            const note = r.note || (r.values && r.values['说明']) || '—';
            const badge = hasPendingNote(note) ? ' <span class="chip chip-pending">待核实</span>' : '';
            return `<td>${esc(note)}${badge}</td>`;
          }
          const v = r.values ? r.values[h] : '';
          return `<td>${esc(v)}</td>`;
        }).join('') + '</tr>';
      }).join('');

      const seg = (key, label) => `<button type="button" class="${state.detailStatus===key?'is-active':''}" data-detail-status="${key}">${label}</button>`;

      pageHost.innerHTML = `
      <div class="content">
        ${crumb([
          { label: '参股公司全盘风险扫描' },
          { label: '风险扫描报告', action: 'list' },
          { label: meta.period + ' · 总览', action: 'overview' },
          { label: rule.code + ' ' + rule.name }
        ])}
        <div class="page-intro">
          <div>
            <div class="eyebrow">参股公司全盘风险扫描 / ${esc(meta.period)} / 规则详情</div>
            <h1>${esc(rule.title)}</h1>
          </div>
          <div class="intro-actions">
            <button class="btn" type="button" id="backOverview">← 返回总览</button>
            <button class="btn btn-primary" type="button" id="exportDetailBtn">导出本规则</button>
          </div>
        </div>
        <section class="dashboard-shell">
          <div class="detail-shell">
            <section class="card detail-hero">
              <div class="hero-top">
                <div>
                  <div class="detail-meta">
                    ${levelChip(rule.level)}
                    <span class="meta-pill">规则编号 ${esc(rule.code)}</span>
                    <span class="meta-pill">报告期 ${esc(meta.period)}</span>
                    <span class="meta-pill">● 触发 ${rule.triggerCount} · ○ 关注 ${rule.attentionCount}</span>
                  </div>
                  <div class="cond-box"><strong>触发条件：</strong>${esc(rule.condition)}</div>
                  <div class="concl-box"><strong>扫描结论：</strong>${esc(rule.conclusion)}</div>
                </div>
              </div>
            </section>
            <section class="card table-card">
              <div class="card-head">
                <h2>公司明细</h2>
                <div class="detail-filter">
                  <div class="seg">
                    ${seg('全部','全部')}
                    ${seg('触发或关注','触发/关注')}
                    ${seg('触发','仅触发')}
                    ${seg('关注','仅关注')}
                  </div>
                </div>
              </div>
              <div class="table-wrap">
                ${rows.length ? `
                <table class="risk-table">
                  <thead><tr>${thead}</tr></thead>
                  <tbody>${tbody}</tbody>
                </table>` : `
                <div class="empty-state"><strong>当前筛选下暂无公司</strong><span>可切换至“全部”查看 7 家参股公司明细。</span></div>`}
              </div>
            </section>
          </div>
        </section>
      </div>`;

      document.querySelectorAll('[data-crumb="list"]').forEach(b => b.addEventListener('click', goList));
      document.querySelectorAll('[data-crumb="overview"]').forEach(b => b.addEventListener('click', () => goOverview(state.reportId)));
      document.getElementById('backOverview')?.addEventListener('click', () => goOverview(state.reportId));
      document.getElementById('exportDetailBtn')?.addEventListener('click', () => showToast(`导出「${rule.code}」占位：后续对接导出服务`));
      document.querySelectorAll('[data-detail-status]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.detailStatus = btn.getAttribute('data-detail-status');
          renderDetail();
        });
      });
      bindStatusCells();
    }

    function render() {
      if (state.view === 'detail' && state.ruleCode && state.reportId) renderDetail();
      else if (state.view === 'overview' && state.reportId) renderOverview();
      else renderList();
    }

    function applyHash() {
      const h = (location.hash || '').replace(/^#/, '');
      const params = new URLSearchParams(h);
      const view = params.get('view') || 'list';
      const report = params.get('report');
      const rule = params.get('rule');
      if (view === 'detail' && report && rule && REPORT_PACK.byId[report] && REPORT_PACK.byId[report].rules[rule]) {
        state.view = 'detail';
        state.reportId = report;
        state.ruleCode = rule;
      } else if (view === 'overview' && report && REPORT_PACK.byId[report]) {
        state.view = 'overview';
        state.reportId = report;
        state.ruleCode = null;
      } else {
        state.view = 'list';
        state.reportId = null;
        state.ruleCode = null;
      }
      render();
    }

    // shell bindings
    sidebarToggle.addEventListener('click', () => {
      const collapsed = body.classList.toggle('sidebar-collapsed');
      sidebarToggle.setAttribute('aria-expanded', String(!collapsed));
      sidebarToggle.setAttribute('aria-label', collapsed ? '展开左侧导航' : '隐藏左侧导航');
      sidebarToggle.querySelector('span').textContent = collapsed ? '›' : '‹';
      showToast(collapsed ? '左侧导航已隐藏' : '左侧导航已展开');
    });

    document.querySelectorAll('[data-collapse]').forEach(title => {
      title.addEventListener('click', () => {
        const children = title.nextElementSibling;
        title.classList.toggle('is-collapsed');
        children.classList.toggle('is-collapsed');
        if (!children.classList.contains('is-collapsed')) children.style.maxHeight = children.scrollHeight + 'px';
        else children.style.maxHeight = '0';
      });
    });
    document.querySelectorAll('.nav-children:not(.is-collapsed)').forEach(c => { c.style.maxHeight = c.scrollHeight + 'px'; });

    document.getElementById('navList')?.addEventListener('click', goList);
    document.getElementById('navOverview')?.addEventListener('click', () => {
      const current = REPORT_PACK.list.find(r => r.isCurrent && REPORT_PACK.byId[r.id]);
      if (current) goOverview(current.id);
      else showToast('请先从报告列表选择一份已生成报告');
    });
    document.querySelectorAll('[data-page]').forEach(link => {
      if (link.id === 'navList' || link.id === 'navOverview') return;
      link.addEventListener('click', () => showToast(`${link.dataset.page}为示意入口，本原型聚焦风险扫描报告`));
    });
    document.querySelectorAll('[data-global]').forEach(item => {
      item.addEventListener('click', () => {
        document.querySelectorAll('[data-global]').forEach(x => x.classList.remove('is-active'));
        item.classList.add('is-active');
        showToast(`已切换至${item.dataset.global}`);
      });
    });
    document.addEventListener('click', event => {
      const item = event.target.closest('[data-action]');
      if (item) showToast(`${item.dataset.action}功能已触发`);
    });

    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('modalCancel').addEventListener('click', closeModal);
    modalBackdrop.addEventListener('click', e => { if (e.target === modalBackdrop) closeModal(); });
    document.getElementById('modalGoto').addEventListener('click', () => {
      const ctx = state.modalCtx;
      closeModal();
      if (ctx?.code) goDetail(ctx.code);
    });

    window.addEventListener('hashchange', applyHash);
    location.hash = location.hash || 'view=list';
    applyHash();

  </script>
</body>
</html>
