<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>股权管理工作台</title>
  <style>
    :root {
      --brand: rgb(46, 80, 201);
      --brand-strong: #2456d3;
      --brand-soft: #edf3ff;
      --ink: #1f2937;
      --muted: #7b879b;
      --line: #e6ebf4;
      --page: #f4f7fc;
      --card: #ffffff;
      --shadow: 0 10px 30px rgba(49, 79, 150, .08);
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-width: 1180px; min-height: 100%; font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; color: var(--ink); background: var(--page); }
    button, input, select { font: inherit; }
    button { border: 0; cursor: pointer; }
    .app { min-height: 100vh; }
    .topbar { height: 54px; display: flex; align-items: center; padding: 0 16px 0 20px; background: #fff; border-bottom: 1px solid #e9edf4; position: sticky; top: 0; z-index: 20; }
    .brand { width: 220px; display: flex; align-items: center; gap: 10px; padding-right: 22px; }
    .brand img { width: 172px; max-height: 32px; object-fit: contain; object-position: left center; }
    .topnav { display: flex; align-items: center; gap: 3px; height: 100%; }
    .topnav-item { height: 32px; padding: 0 14px; display: inline-flex; align-items: center; gap: 7px; color: #4f5663; border-radius: 8px; background: transparent; font-size: 13px; }
    .topnav-item:hover, .topnav-item.is-active { color: var(--brand); background: #f3f6ff; }
    .topnav-item .icon { width: 15px; height: 15px; display: inline-flex; align-items: center; justify-content: center; line-height: 1; }
    .topnav-item .icon svg { width: 15px; height: 15px; display: block; }
    .topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; color: #687286; }
    .action-icon { position: relative; width: 23px; height: 24px; display: grid; place-items: center; font-size: 18px; background: transparent; color: #667085; }
    .action-icon > svg { width: 16px; height: 16px; display: block; }
    .badge { position: absolute; top: -3px; right: -5px; min-width: 17px; height: 15px; padding: 0 4px; border-radius: 99px; color: #fff; background: #ff4d5d; font-size: 9px; line-height: 15px; }
    .avatar { width: 27px; height: 27px; padding: 0; border-radius: 50%; display: grid; place-items: center; overflow: hidden; background: #e7e3e0; color: white; font-size: 15px; box-shadow: inset 0 0 0 2px #f0f2f5; }
    .avatar img { width: 100%; height: 100%; display: block; object-fit: cover; }
    .more { font-size: 18px; transform: translateY(-2px); }
    .body { position: relative; display: flex; min-height: calc(100vh - 54px); }
    .sidebar { width: 240px; flex: 0 0 240px; min-width: 0; overflow: hidden; background: #fff; border-right: 1px solid #e7ebf2; transition: width .2s ease, flex-basis .2s ease, border-color .2s ease; }
    .sidebar-toggle { position: absolute; top: 50%; left: 240px; z-index: 12; width: 20px; height: 44px; transform: translate(-50%, -50%); display: grid; place-items: center; padding: 0; border: 1px solid #e3e8f2; border-left: 0; border-radius: 0 10px 10px 0; background: #fff; color: #8b97aa; font-size: 18px; line-height: 1; box-shadow: 0 4px 12px rgba(41, 62, 107, .08); transition: left .2s ease, transform .2s ease, background .2s ease, color .2s ease; }
    .sidebar-toggle:hover { color: var(--brand-strong); background: #f5f8ff; }
    .body.sidebar-collapsed .sidebar { width: 0; flex-basis: 0; border-right: 0; }
    .body.sidebar-collapsed .sidebar-toggle { left: 0; transform: translate(0, -50%); border-left: 1px solid #e3e8f2; }
    .sidebar-head { height: 58px; display: flex; align-items: center; padding: 0 24px; border-bottom: 1px solid var(--line); font-size: 17px; font-weight: 700; }
    .side-search { height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; color: #656f80; font-size: 14px; }
    .side-search span:last-child { font-size: 20px; }
    .nav { padding: 3px 0 24px; }
    .nav-section { margin: 0; }
    .nav-title, .nav-link { min-height: 45px; display: flex; align-items: center; padding: 0 24px 0 27px; color: #39404c; font-size: 14px; }
    .nav-title { justify-content: space-between; font-weight: 500; cursor: pointer; }
    .nav-title:hover, .nav-link:hover { background: #f5f8ff; color: var(--brand); }
    .nav-title .chevron { font-size: 16px; color: #6b7280; transition: transform .2s ease; }
    .nav-title.is-collapsed .chevron { transform: rotate(-90deg); }
    .nav-children { overflow: hidden; transition: max-height .25s ease; }
    .nav-children.is-collapsed { max-height: 0 !important; }
    .nav-link { padding-left: 50px; position: relative; cursor: pointer; }
    .nav-link.is-active { color: var(--brand-strong); background: #eaf1ff; font-weight: 600; }
    .nav-link.is-active::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: #2e76f6; border-radius: 0 3px 3px 0; }
    .nav-section + .nav-section { border-top: 1px solid #f2f4f8; margin-top: 8px; padding-top: 5px; }
    .main { min-width: 0; flex: 1; padding: 0 20px 24px; overflow: hidden; }
    .worktab { height: 55px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #e5eaf3; }
    .tab { height: 38px; display: inline-flex; align-items: center; gap: 9px; padding: 0 12px 0 10px; border-radius: 10px 10px 0 0; background: transparent; color: #61718c; font-size: 13px; cursor: pointer; }
    .tab.is-active { color: var(--brand-strong); background: #fff; box-shadow: 0 -1px 0 #e8eef9, 0 1px 0 #fff; }
    .tab-dot { width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; color: #5c7096; background: transparent; font-size: 0; }
    .tab-dot svg { width: 19px; height: 19px; display: block; }
    .tab-close { margin-left: 2px; font-size: 15px; color: #98a2b3; }
    .worktab-actions { margin-left: auto; display: flex; align-items: center; gap: 1px; padding: 2px; border-radius: 8px; background: #f5f7fc; }
    .worktab-actions .action-icon { width: 28px; height: 26px; border-radius: 7px; color: #687690; }
    .worktab-actions .action-icon:hover { color: var(--brand-strong); background: #fff; }
    .content { padding-top: 18px; }
    .page-intro { display: flex; align-items: flex-end; justify-content: space-between; margin: 0 3px 15px; }
    .eyebrow { color: #8b97aa; font-size: 12px; margin-bottom: 6px; }
    h1 { margin: 0; font-size: 22px; letter-spacing: -.02em; }
    .version { margin-left: 10px; color: #98a2b3; font-size: 12px; font-weight: 400; }
    .intro-actions { display: flex; gap: 10px; }
    .btn { height: 36px; padding: 0 15px; border-radius: 10px; border: 1px solid #dce5f5; background: #fff; color: #52627a; font-size: 13px; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 4px 12px rgba(55, 81, 137, .04); }
    .btn:hover { border-color: #b8c9eb; color: var(--brand-strong); }
    .btn-primary { color: #fff; border-color: var(--brand); background: linear-gradient(135deg, #3972dd, #2d56c7); box-shadow: 0 10px 19px rgba(46, 80, 201, .2); }
    .btn-primary:hover { color: #fff; border-color: #1f4bc5; filter: brightness(1.04); }
    .btn-ghost { background: #f7f9fe; border-color: #e0e8f8; }
    .dashboard-shell { background: linear-gradient(145deg, #eef4ff 0%, #f5f8fd 52%, #eff3fb 100%); border: 1px solid #e5ebf6; border-radius: 18px; padding: 25px 24px 28px; min-height: calc(100vh - 170px); }
    .dashboard-layout { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 16px; }
    .card { background: var(--card); border: 1px solid #e8edf6; border-radius: var(--radius); box-shadow: var(--shadow); }
    .company-card { padding: 16px; min-height: 610px; }
    .segmented { display: flex; padding: 4px; background: #edf2fb; border-radius: 14px; gap: 4px; }
    .segmented button { flex: 1; height: 39px; border-radius: 10px; background: transparent; color: #6f7c92; font-weight: 600; font-size: 13px; }
    .segmented button.is-active { background: #fff; color: var(--brand-strong); box-shadow: 0 4px 10px rgba(61, 93, 160, .12); }
    .company-title { display: flex; align-items: center; justify-content: space-between; margin: 18px 0 12px; font-weight: 700; }
    .count-pill { min-width: 43px; height: 28px; padding: 0 10px; display: inline-flex; align-items: center; justify-content: center; border-radius: 99px; color: var(--brand-strong); background: #edf3ff; font-size: 12px; }
    .search-row { display: flex; height: 39px; border: 1px solid #e2eaf7; border-radius: 10px; overflow: hidden; }
    .search-row input { flex: 1; min-width: 0; border: 0; padding: 0 12px; color: var(--ink); outline: none; font-size: 12px; }
    .search-row input::placeholder { color: #a9b3c3; }
    .search-row button { width: 58px; color: #fff; background: #2f6fe5; font-size: 12px; }
    .pager { display: flex; align-items: center; gap: 8px; margin-top: 11px; }
    .pager button, .page-index, .page-size { height: 34px; border: 1px solid #e1e8f5; background: #f8faff; border-radius: 9px; color: #6f7c93; font-size: 12px; }
    .pager button { width: 35px; font-size: 17px; }
    .page-index { flex: 1; display: grid; place-items: center; color: var(--brand-strong); background: #fff; }
    .page-index strong { font-size: 16px; }
    .page-size { width: 96px; padding: 0 10px; display: flex; align-items: center; justify-content: space-between; }
    .empty-box { min-height: 76px; margin-top: 15px; border: 1px dashed #d8e1f0; border-radius: 13px; display: grid; place-items: center; color: #8996aa; font-size: 13px; background: #fbfcfe; }
    .empty-box strong { display: block; margin-bottom: 5px; color: #7a8aa3; font-size: 13px; }
    .small-tip { margin-top: 12px; color: #a1adbe; font-size: 11px; line-height: 1.6; }
    .right-stack { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
    .overview-bar { display: flex; justify-content: flex-end; gap: 9px; }
    .overview-bar .btn { height: 35px; }
    .metric-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .metric { padding: 15px 16px; min-height: 88px; }
    .metric-value { color: var(--brand-strong); font-weight: 700; font-size: 18px; line-height: 1.2; }
    .metric-label { margin-top: 9px; color: #75839a; font-size: 12px; }
    .metric-meta { margin-top: 6px; color: #9ba7b8; font-size: 11px; }
    .filter-card { padding: 18px; }
    .filter-grid { display: grid; grid-template-columns: 180px 155px minmax(160px, 1fr) auto; gap: 12px; align-items: end; }
    .field label { display: block; margin: 0 0 7px 2px; color: #738198; font-size: 12px; }
    .control { width: 100%; height: 40px; padding: 0 12px; border: 1px solid #e0e8f5; border-radius: 10px; background: #fff; color: #3f4b5e; outline: none; }
    select.control { appearance: none; background-image: linear-gradient(45deg, transparent 50%, #8895aa 50%), linear-gradient(135deg, #8895aa 50%, transparent 50%); background-position: calc(100% - 17px) 17px, calc(100% - 12px) 17px; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
    .filter-actions { display: flex; gap: 8px; }
    .filter-actions .btn { height: 40px; }
    .timeline-card { padding: 17px 18px 19px; min-height: 405px; }
    .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .card-head h2 { margin: 0; font-size: 15px; }
    .view-actions { display: flex; gap: 7px; }
    .view-actions button { height: 31px; padding: 0 12px; border-radius: 9px; background: #f1f5fd; color: #71809a; font-size: 12px; }
    .view-actions button.is-active { background: #fff; color: var(--brand-strong); box-shadow: 0 2px 8px rgba(53, 82, 148, .12); }
    .timeline-summary { padding: 14px 16px; border: 1px solid #edf0f7; border-radius: 12px; background: #fbfcff; color: #7d8ba0; font-size: 12px; }
    .timeline-top { display: flex; justify-content: space-between; align-items: center; }
    .timeline-switch { display: flex; gap: 2px; padding: 3px; background: #f2f5fb; border-radius: 9px; }
    .timeline-switch button { height: 25px; padding: 0 10px; border-radius: 7px; background: transparent; color: #76859b; font-size: 11px; }
    .timeline-switch button.is-active { background: #fff; color: var(--brand-strong); box-shadow: 0 2px 6px rgba(50, 79, 145, .1); }
    .progress-track { height: 8px; margin-top: 15px; background: #eaf0fc; border-radius: 99px; overflow: hidden; }
    .progress-track span { display: block; width: 30%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #9fb4e2, #7d9de0); }
    .timeline-grid { display: grid; grid-template-columns: 138px 138px minmax(0, 1fr); margin-top: 13px; border-top: 1px solid #edf1f7; border-left: 1px solid #edf1f7; }
    .timeline-grid > div { min-height: 91px; padding: 15px; border-right: 1px solid #edf1f7; border-bottom: 1px solid #edf1f7; display: flex; align-items: center; }
    .timeline-grid .stage { justify-content: center; background: #eff5ff; color: var(--brand-strong); text-align: center; font-weight: 700; position: relative; }
    .timeline-grid .stage::before { content: ""; position: absolute; top: 14px; left: 50%; width: 8px; height: 8px; transform: translateX(-50%); border-radius: 50%; background: #326ce0; box-shadow: 0 0 0 5px #dfeafe; }
    .timeline-grid .substage { justify-content: center; background: #fafcff; color: #64738d; font-size: 13px; font-weight: 600; }
    .timeline-grid .timeline-empty { justify-content: center; color: #a0aabd; font-size: 12px; }
    .notice { padding: 22px; text-align: center; color: #8795aa; border: 1px dashed #dce5f3; border-radius: 13px; background: rgba(255,255,255,.56); font-size: 13px; }
    .notice strong { display: block; margin-bottom: 7px; color: #657692; }
    .page-placeholder { min-height: calc(100vh - 170px); display: grid; place-items: center; }
    .blank-page { width: 100%; min-height: calc(100vh - 145px); border: 0; border-radius: 0; background: transparent; }
    .placeholder-inner { width: min(620px, 80%); padding: 54px 60px; text-align: center; }
    .placeholder-icon { width: 56px; height: 56px; margin: 0 auto 18px; display: grid; place-items: center; border-radius: 17px; color: var(--brand-strong); background: #e7efff; font-size: 25px; }
    .placeholder-inner h2 { margin: 0 0 9px; font-size: 20px; }
    .placeholder-inner p { margin: 0 auto 21px; max-width: 440px; color: #8a96a8; font-size: 13px; line-height: 1.8; }
    .toast { position: fixed; left: 50%; bottom: 32px; z-index: 50; transform: translate(-50%, 20px); padding: 11px 17px; border-radius: 10px; color: #fff; background: rgba(31, 41, 55, .92); box-shadow: 0 10px 30px rgba(0,0,0,.15); opacity: 0; pointer-events: none; transition: .24s ease; font-size: 13px; }
    .toast.is-show { opacity: 1; transform: translate(-50%, 0); }
    .modal-backdrop { position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center; background: rgba(20, 32, 56, .35); backdrop-filter: blur(3px); }
    .modal-backdrop.is-show { display: flex; }
    .modal { width: 470px; border-radius: 17px; background: #fff; box-shadow: 0 24px 70px rgba(34, 57, 107, .2); overflow: hidden; }
    .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 21px; border-bottom: 1px solid var(--line); }
    .modal-head h3 { margin: 0; font-size: 16px; }
    .modal-close { background: transparent; color: #9aa5b6; font-size: 21px; }
    .modal-body { padding: 20px 21px; }
    .modal-body .field + .field { margin-top: 15px; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 9px; padding: 14px 21px 18px; background: #fafbfe; }
    @media (max-width: 1380px) {
      .sidebar { width: 220px; flex-basis: 220px; }
      .sidebar-toggle { left: 220px; }
      .brand { width: 195px; }
      .brand img { width: 155px; }
      .dashboard-shell { padding: 18px; }
      .dashboard-layout { grid-template-columns: 285px minmax(0, 1fr); }
      .metric-grid { gap: 8px; }
    }
    .content { padding-top: 12px; }
    .workspace-shell { position: relative; overflow: hidden; background: linear-gradient(145deg, #eef4ff 0%, #f8faff 48%, #eef3fb 100%); border: 1px solid #e5ebf6; border-radius: 16px; padding: 13px; min-height: calc(100vh - 138px); }
    .workspace-shell::before { content: ""; position: absolute; top: -190px; right: -100px; width: 520px; height: 360px; border-radius: 50%; background: radial-gradient(circle, rgba(75, 119, 224, .13), rgba(75, 119, 224, 0) 70%); pointer-events: none; }
    .module-card { position: relative; z-index: 1; overflow: hidden; padding: 11px; }
    .module-card.overall-card { background: linear-gradient(135deg, #fff 0%, #fbfdff 70%, #f1f6ff 100%); border-color: #dbe6fa; }
    .module-card.overall-card::after { content: ""; position: absolute; top: 0; left: 22px; right: 22px; height: 2px; background: linear-gradient(90deg, transparent, #4d75db 28%, #73a7e8 72%, transparent); }
    .module-card + .module-card, .lifecycle-block + .module-card { margin-top: 9px; }
    .module-head { display: flex; align-items: center; gap: 7px; margin-bottom: 8px; }
    .module-head h2 { margin: 0; font-size: 14px; }
    .module-head p { margin: 0; color: #8995a8; font-size: 11px; }
    .module-tag { padding: 3px 8px; border-radius: 99px; color: var(--brand-strong); background: var(--brand-soft); font-size: 10px; font-weight: 700; }
    .entry-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
    .overall-card .entry-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .support-card .entry-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .function-entry { position: relative; min-height: 58px; display: flex; align-items: center; gap: 8px; padding: 8px; overflow: hidden; border: 1px solid #e4eaf4; border-radius: 10px; background: rgba(255,255,255,.94); text-align: left; transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease; }
    .function-entry::before { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 48%, rgba(85, 128, 227, .07)); opacity: 0; transition: opacity .2s ease; }
    .function-entry:hover { transform: translateY(-2px); border-color: #adc1ed; box-shadow: 0 12px 24px rgba(46, 80, 201, .11); }
    .function-entry:hover::before { opacity: 1; }
    .entry-icon { width: 32px; height: 32px; flex: 0 0 32px; display: grid; place-items: center; border-radius: 9px; color: var(--brand-strong); background: #edf3ff; }
    .entry-icon svg { width: 17px; height: 17px; display: block; }
    .entry-copy, .entry-arrow, .entry-icon { position: relative; z-index: 1; }
    .entry-copy { min-width: 0; flex: 1; }
    .entry-title { display: block; margin-bottom: 3px; color: #2f3948; font-size: 12px; font-weight: 700; line-height: 1.3; }
    .entry-desc { display: block; overflow: hidden; color: #929daf; font-size: 10px; white-space: nowrap; text-overflow: ellipsis; }
    .entry-arrow { color: #aab4c4; font-size: 16px; }
    .function-entry.is-disabled { cursor: not-allowed; border-color: #e4e7ec; background: #f2f3f5; filter: grayscale(.85); opacity: .62; box-shadow: none; }
    .function-entry.is-disabled:hover { transform: none; border-color: #e4e7ec; box-shadow: none; }
    .function-entry.is-disabled::before { display: none; }
    .function-entry.is-disabled .entry-arrow { min-width: 42px; color: #8e98a7; font-size: 9px; white-space: nowrap; }
    .lifecycle-block { position: relative; z-index: 1; margin-top: 9px; padding-top: 0; }
    .lifecycle-title { display: flex; align-items: center; justify-content: space-between; margin: 0 2px 6px; }
    .lifecycle-title h2 { margin: 0; font-size: 14px; }
    .lifecycle-title span { color: #8b97aa; font-size: 11px; }
    .stage-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .stage-card { position: relative; min-height: 326px; display: flex; flex-direction: column; overflow: hidden; padding: 9px; border-color: #e0e7f3; background: linear-gradient(180deg, #fff 0%, #fff 82%, #fafcff 100%); }
    .stage-head { display: flex; align-items: center; justify-content: space-between; margin: -9px -9px 8px; padding: 9px; border-bottom: 1px solid #e6ecf6; background: linear-gradient(135deg, #edf3ff, #f9fbff); }
    .stage-card[data-module-card="投资"] .stage-head { background: linear-gradient(135deg, #f0efff, #fbfaff); border-bottom-color: #e8e5f7; }
    .stage-card[data-module-card="运营"] .stage-head { background: linear-gradient(135deg, #eaf8fa, #f8fcfd); border-bottom-color: #dfeff2; }
    .stage-card[data-module-card="退出"] .stage-head { background: linear-gradient(135deg, #fff5e8, #fffaf4); border-bottom-color: #f3e7d7; }
    .stage-name { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; }
    .stage-number { width: 21px; height: 21px; display: grid; place-items: center; border-radius: 6px; color: #fff; background: linear-gradient(135deg, #3d6bd6, #2d52bd); box-shadow: 0 4px 8px rgba(46,80,201,.16); font-size: 10px; }
    .stage-card[data-module-card="投资"] .stage-number { background: linear-gradient(135deg, #7771d6, #5652b8); box-shadow: 0 5px 10px rgba(86,82,184,.17); }
    .stage-card[data-module-card="运营"] .stage-number { background: linear-gradient(135deg, #36a1b9, #197f99); box-shadow: 0 5px 10px rgba(25,127,153,.17); }
    .stage-card[data-module-card="退出"] .stage-number { background: linear-gradient(135deg, #da9744, #b96d17); box-shadow: 0 5px 10px rgba(185,109,23,.17); }
    .stage-state { color: #6680b7; font-size: 10px; }
    .stage-card .entry-grid { grid-template-columns: 1fr; align-content: start; gap: 6px; }
    .stage-card .function-entry { min-height: 54px; padding: 7px; }
    .stage-card .entry-icon { width: 30px; height: 30px; flex-basis: 30px; border-radius: 8px; }
    .capacity-note { margin-top: auto; padding: 7px 5px 1px; border-top: 1px dashed #e2e8f2; color: #a2adbd; font-size: 9px; text-align: center; }

    const dashboardPage = () => `

    function renderPage(title) { pageHost.innerHTML = title === '股权管理工作台' ? dashboardPage() : placeholderPage(); document.getElementById('worktabTitle').textContent = title; bindPageActions(); }

      let selectedFunction = null;
      document.querySelectorAll('.function-entry').forEach(item => item.addEventListener('click', () => { selectedFunction = item; document.getElementById('modalTitle').textContent = item.dataset.name; document.getElementById('modalModule').textContent = `${item.dataset.module} · ${item.dataset.functionId}`; document.getElementById('modalDesc').textContent = `${item.dataset.desc}。当前为原型演示，正式跳转地址待系统配置。`; modalBackdrop.classList.add('is-show'); }));
      document.getElementById('modalSubmit').onclick = () => { if (!selectedFunction) return; closeModal(); showToast(`已选择“${selectedFunction.dataset.name}”，正式入口待配置`); };
    }
    sidebarToggle.addEventListener('click', () => { const collapsed = body.classList.toggle('sidebar-collapsed'); sidebarToggle.setAttribute('aria-expanded', String(!collapsed)); sidebarToggle.setAttribute('aria-label', collapsed ? '展开左侧导航' : '隐藏左侧导航'); sidebarToggle.querySelector('span').textContent = collapsed ? '›' : '‹'; showToast(collapsed ? '左侧导航已隐藏' : '左侧导航已展开'); });
    document.querySelectorAll('[data-page]').forEach(link => link.addEventListener('click', () => { document.querySelectorAll('[data-page]').forEach(x => x.classList.remove('is-active')); link.classList.add('is-active'); renderPage(link.dataset.page); }));
    document.querySelectorAll('[data-collapse]').forEach(title => title.addEventListener('click', () => { const children = title.nextElementSibling; title.classList.toggle('is-collapsed'); children.classList.toggle('is-collapsed'); if (!children.classList.contains('is-collapsed')) children.style.maxHeight = children.scrollHeight + 'px'; }));
    document.querySelectorAll('[data-global]').forEach(item => item.addEventListener('click', () => { document.querySelectorAll('[data-global]').forEach(x => x.classList.remove('is-active')); item.classList.add('is-active'); showToast(`已切换至${item.dataset.global}`); }));
    document.addEventListener('click', event => { const item = event.target.closest('[data-action]'); if (item) showToast(`${item.dataset.action}功能已触发`); });
    const modalBackdrop = document.getElementById('modalBackdrop');
    function closeModal() { modalBackdrop.classList.remove('is-show'); }
    document.getElementById('modalClose').addEventListener('click', closeModal); document.getElementById('modalCancel').addEventListener('click', closeModal); modalBackdrop.addEventListener('click', e => { if (e.target === modalBackdrop) closeModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
