    if(['saveDelivery','deliveryAttachment','submitDelivery'].includes(a)){if(state.identityStatus==='exited')return showPrototypeToast('已出库专家不可提交成果');saveCurrentForm();if(a==='deliveryAttachment'){state.deliveryDrafts[t.id].attachment='技术研判意见.pdf（模拟）';return renderDelivery(t.id);}if(a==='saveDelivery')return showPrototypeToast('草稿已保存');if(!valid())return;t.versions.push({...state.deliveryDrafts[t.id]});t.status='acceptance_pending';record(t,'提交成果版本 '+t.versions.length);return navigateExpert('taskDetail',{taskId:t.id,tab:'交付'});}
    if(a==='profileChange'){if(state.identityStatus==='exited')return showPrototypeToast('已出库专家不可变更档案');if(!valid())return;state.profileChanges.push(readForm().change);showPrototypeToast('变更申请已提交，原档案继续有效');return renderExpertProfile();}
    if(a==='availability'){if(state.identityStatus==='exited')return showPrototypeToast('已出库专家不可调整服务状态');const d=readForm();state.availability.days=Array.from({length:7},(_,i)=>!!d['day'+i]);state.availability.period=d.period;state.availability.date=d.unavailable;state.identityStatus=d.paused?'paused':'active';return showPrototypeToast('安排已保存');}
    if(a==='objection'){if(valid()){record(t,'专家提交评价异议：'+readForm().objection);showPrototypeToast('异议已提交，原评价不变');}return;}
    if(a==='requestAttachment'){document.getElementById('requestAttachmentLabel').textContent='需求说明.pdf（模拟）';return;}
    if(a==='submitRequest'){if(!valid())return;const d=readForm();if(d.title.length>50)return showPrototypeToast('需求主题最多50字');if(d.date<new Date().toLocaleDateString('en-CA'))return showPrototypeToast('期望日期不能早于今天');const id='XQ-2026-'+String(98+state.serviceRequests.length).padStart(4,'0');state.serviceRequests.push({...d,id});shell('提交成功',card(id,'<p>需求已提交，工作人员将进一步确认。</p>'+link('查看服务申请','requests')));return;}
    if(a?.startsWith('message:')){const m=state.messages.find(x=>x.id===a.slice(8));m.read=true;return m.route?navigateExpert(m.route,m.params):showPrototypeToast('该事项已处理，原邀约已失效');}
  });
  const oldProfile=goProfile, oldService=openServiceCategory;
  goProfile=function(){saveCurrentForm();state.routeStack=[];state.currentRoute={name:'user',params:{}};renderUserCenter();};
  openServiceCategory=function(name){root.style.display='none';oldService(name);if(name==='专家人才'){const target=document.querySelector('#cardList .service-hero');const entry=document.createElement('div');entry.className='expert-shell';entry.innerHTML=link('入库邀请','enrollmentInvite')+link('专家工作区','entry');entry.addEventListener('click',e=>{const b=e.target.closest('[data-route]');if(!b)return;state.routeStack=[];state.currentRoute=null;navigateExpert(b.dataset.route==='enrollmentInvite'?'enrollmentInvite':['active','paused','exited'].includes(state.identityStatus)?'expertWorkspace':state.identityStatus==='reviewing'?'progress':'enrollmentInvite');});target?.after(entry);}};
  document.querySelector('.bottom').addEventListener('click',e=>{const b=e.target.closest('.nav');if(!b)return;saveCurrentForm();if(b.dataset.nav!=='个人中心'){root.style.display='none';root.classList.remove('show');state.routeStack=[];state.currentRoute=null;['profile','community','aiPage','subpage'].forEach(id=>document.getElementById(id).style.removeProperty('display'));}},true);

  const MOBILE_KEY='expert-mobile-invitation-v1';
  try { const saved=JSON.parse(localStorage.getItem(MOBILE_KEY)||'null');if(saved){['identityStatus','onboardingDraft','deliveryDrafts','tasks','enrollmentInvite','enrollmentInvites'].forEach(k=>{if(saved[k])state[k]=saved[k];});} } catch {}
  state.enrollmentInvite=state.enrollmentInvite||{id:'INV-MOBILE-001',status:'pending',reason:'邀请参与动力电池技术咨询',field:'动力电池',phone:'138****5208'};
  const inviteSamples=[
    {id:'INV-MOBILE-006',status:'accepted',reason:'邀请参与智能制造技术咨询',field:'智能制造',phone:'138****5208'},
    {id:'INV-MOBILE-008',status:'accepted',reason:'邀请参与新能源汽车热管理技术评审',field:'汽车热管理',phone:'138****5208'},
    {id:'INV-MOBILE-007',status:'rejected',reason:'邀请参与汽车芯片产业研究',field:'汽车芯片',phone:'138****5208',reasonRejected:'近期工作安排较满，暂无法参与本次专家服务。'},
    {id:'INV-MOBILE-002',status:'submitted',reason:'邀请参与智能网联汽车产业研究',field:'智能网联',phone:'138****5208',submittedAt:'2026-09-03 16:20'},
    {id:'INV-MOBILE-003',status:'reviewRejected',reason:'邀请参与汽车软件技术评审',field:'汽车软件',phone:'138****5208',submittedAt:'2026-08-26 10:15',reviewedAt:'2026-08-28 14:30',reviewOpinion:'工作经历缺少起止时间，代表项目未说明本人职责，请补充后重新提交。'},
    {id:'INV-MOBILE-004',status:'approved',reason:'邀请参与新能源供应链专项咨询',field:'新能源供应链',phone:'138****5208',submittedAt:'2026-07-18 09:40',reviewedAt:'2026-07-22 11:00',reviewOpinion:'资料完整，分管领导审批及聘书签署均已完成，已正式入库。'},
    {id:'INV-MOBILE-005',status:'letterPending',reason:'邀请参与动力电池技术咨询',field:'动力电池',phone:'138****5208',submittedAt:'2026-09-04 09:40',reviewedAt:'2026-09-06 11:00',reviewOpinion:'分管领导审批通过，聘书已发送，等待专家签署。',appointment:{number:'PS-2026-005',termStart:'2026-09-15',termEnd:'2029-09-14',signingDeadline:'2026-09-14',attachment:'专家聘书-张明-待签署.pdf'}}
  ];
  state.enrollmentInvites=Array.isArray(state.enrollmentInvites)&&state.enrollmentInvites.length?state.enrollmentInvites:[state.enrollmentInvite];
  inviteSamples.forEach(sample=>{if(!state.enrollmentInvites.some(x=>x.id===sample.id))state.enrollmentInvites.push(sample);});
  function syncPrimaryInvite(){state.enrollmentInvite.onboardingDraft={...state.onboardingDraft};const index=state.enrollmentInvites.findIndex(x=>x.id===state.enrollmentInvite.id);if(index>=0)state.enrollmentInvites[index]=state.enrollmentInvite;else state.enrollmentInvites.unshift(state.enrollmentInvite);}
  function persistMobile(){try{syncPrimaryInvite();localStorage.setItem(MOBILE_KEY,JSON.stringify({identityStatus:state.identityStatus,onboardingDraft:state.onboardingDraft,deliveryDrafts:state.deliveryDrafts,tasks:state.tasks,enrollmentInvite:state.enrollmentInvite,enrollmentInvites:state.enrollmentInvites}));}catch{showPrototypeToast('本地保存失败，请勿关闭页面');}}
  state.messages.unshift({id:'enrollment-notice',category:'审核',title:'专家入库邀请 · 请确认意向',createdAt:'演示通知',read:false,route:'enrollmentInvite',params:{}});
  if(!state.messages.some(m=>m.id==='appointment-notice'))state.messages.unshift({id:'appointment-notice',category:'审核',title:'专家聘书待签署 · 请前往E签宝',createdAt:'演示通知',read:false,route:'appointment',params:{inviteId:'INV-MOBILE-005'}});
  function renderEnrollmentInvite(){
    syncPrimaryInvite();
    const inviteId=state.currentRoute?.params?.inviteId;
    const labels={pending:'待专家确认',accepted:'待完善资料',rejected:'已拒绝邀请',submitted:'资料审核中',reviewRejected:'资料审核驳回',letterPending:'待签署聘书',approved:'已正式入库'};
    if(!inviteId)return shell('入库邀请',state.enrollmentInvites.map(invite=>card(invite.reason,`<span class="expert-pill">${labels[invite.status]||invite.status}</span><p>${esc(invite.id)} · ${esc(invite.field)}</p>${link('查看邀请详情','enrollmentInvite',{inviteId:invite.id})}`)).join(''));
    const invite=inviteId===state.enrollmentInvite.id?state.enrollmentInvite:state.enrollmentInvites.find(x=>x.id===inviteId);
    if(!invite)return shell('入库邀请',renderEmptyState('未找到该邀请记录'));
    if(invite.id!==state.enrollmentInvite.id){state.enrollmentInvite=invite;state.onboardingDraft={...(invite.onboardingDraft||{})};}
    const action=invite.status==='letterPending'?link('查看并签署聘书','appointment',{inviteId:invite.id}):invite.status==='pending'?button('同意并完善资料','enrollAgree',true)+button('拒绝邀请','enrollReject'):invite.status==='accepted'?link('继续填写教育经历、专业能力等资料','onboarding'):invite.status==='submitted'?link('查看入库进度','progress'):invite.status==='reviewRejected'?link('补充并重新提交资料','onboarding',{step:1}):invite.status==='approved'?'<p>聘书已完成签署，现已正式入库。</p>':'<p>拒绝原因：'+esc(invite.reasonRejected||'')+'</p>';
    shell('入库邀请详情',card('专家入库邀请 · '+invite.id,`<p>被邀请人：张明<br>手机号：${esc(invite.phone)}<br>拟服务领域：${esc(invite.field)}</p><p>${esc(invite.reason)}</p><p>当前状态：${labels[invite.status]||invite.status}</p>${invite.submittedAt?`<p>资料提交时间：${esc(invite.submittedAt)}</p>`:''}${invite.reviewedAt?`<p>审核时间：${esc(invite.reviewedAt)}</p>`:''}${invite.reviewOpinion?`<p><b>审核意见：</b>${esc(invite.reviewOpinion)}</p>`:''}<p>短信演示：您收到专家入库邀请，请在小程序个人中心—入库邀请查看。</p>${action}<p>说明：此为独立受邀演示记录，不代表真实短信或PC同步。资料审核完成后，才由PC工作台发起分管领导审批；审批通过即正式入库。</p>`));
  }
  root.addEventListener('click',e=>{
    const b=e.target.closest('button');const a=b?.dataset.action;
    if(a==='enrollAgree'&&state.enrollmentInvite.status==='pending'){state.enrollmentInvite.status='accepted';state.identityStatus='invited';persistMobile();navigateExpert('onboarding',{step:1});}
    if(a==='enrollReject'&&state.enrollmentInvite.status==='pending'){shell('拒绝入库邀请',card('请填写原因',`<form>${field('拒绝原因','reason','','textarea')}${button('确认拒绝','enrollRejectConfirm')}</form>`));}
    if(a==='enrollRejectConfirm'&&state.enrollmentInvite.status==='pending'&&valid()){state.enrollmentInvite.reasonRejected=readForm().reason;state.enrollmentInvite.status='rejected';persistMobile();renderEnrollmentInvite();}
    if(a==='completeEsign'){const inviteId=state.currentRoute?.params?.inviteId;const invite=state.enrollmentInvites.find(x=>x.id===inviteId);if(!invite||invite.status!=='letterPending')return showPrototypeToast('该聘书当前不可签署');if(!document.getElementById('esignConsent')?.checked)return showPrototypeToast('请先阅读并同意使用电子签名');invite.status='approved';invite.appointment.signedAt=new Date().toLocaleString('zh-CN');invite.appointment.status='已签署';if(invite.id===state.enrollmentInvite.id)state.enrollmentInvite=invite;state.identityStatus='active';persistMobile();showPrototypeToast('E签宝签署完成，您已正式入库');return navigateExpert('appointment',{inviteId});}
    queueMicrotask(persistMobile);
  });
  window.addEventListener('pagehide',()=>{saveCurrentForm();persistMobile();});

  document.title='移动端投资合作服务平台 · 专家人才库 v4';
  window.expertV4 = {state,identityLabels,statusLabels,TASK_FILTERS,esc,getTaskById,showPrototypeToast,metrics,renderLoadingState,renderEmptyState,renderErrorState};
})();
</script>
